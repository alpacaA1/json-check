<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Doc Builder · 视觉 PRD & 培训文档生成器</title>
<style>
  :root {
    --bg: #f5f0e8;
    --panel: #ffffff;
    --panel-hover: #fffdf9;
    --border: rgba(126, 105, 83, 0.18);
    --border-hover: rgba(223, 106, 75, 0.45);
    --text-main: #1f201d;
    --text-muted: #67645c;
    --accent: #df6a4b;
    --accent-dark: #9f3f2a;
    --accent-bg: #f2d6c9;
    --dark-panel: #242421;
    --dark-text: #fffdf9;
    --card-shadow: 0 1px 3px rgba(48,38,27,.06), 0 8px 24px rgba(48,38,27,.05);
  }

  body.dark-theme {
    --bg: #0f1115;
    --panel: #171b22;
    --panel-hover: #1e232d;
    --border: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(99, 102, 241, 0.55);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-dark: #818cf8;
    --accent-bg: rgba(99, 102, 241, 0.18);
    --dark-panel: #0b0d11;
    --dark-text: #f1f5f9;
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }

  button, input, textarea { font: inherit; }

  /* Header Controls Toolbar */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: rgba(255,255,255,0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
    gap: 12px;
  }
  body.dark-theme header {
    background: rgba(23, 27, 34, 0.92);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-brand b {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
  }

  .header-brand h1 {
    font-size: 16px;
    font-weight: 750;
    color: var(--text-main);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  button {
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  button:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  button.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  button.accent:hover { opacity: 0.92; }

  /* Onboarding Banner */
  .onboarding-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    background: var(--accent-bg);
    color: var(--accent-dark);
    font-size: 12px;
    font-weight: 600;
  }
  .onboarding-banner button {
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 14px;
    min-height: auto;
    padding: 0 4px;
  }

  /* Main Document Container */
  .doc-container {
    max-width: 1280px;
    margin: 0 auto;
    width: 100%;
    padding: 28px 24px 80px;
    flex: 1;
  }

  /* Document Meta Header */
  .doc-header-block {
    margin-bottom: 28px;
    padding: 28px 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--card-shadow);
  }

  .doc-meta-tags {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .tag-badge {
    padding: 4px 11px;
    border-radius: 20px;
    background: var(--accent-bg);
    color: var(--accent-dark);
    font-size: 11px;
    font-weight: 700;
    outline: none;
  }

  .doc-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.03em;
    outline: none;
    padding: 4px 0;
    border-bottom: 1.5px dashed transparent;
    transition: border-color 0.2s;
  }

  .doc-title:focus, .doc-subtitle:focus, [contenteditable="true"]:focus {
    border-bottom-color: var(--accent) !important;
  }

  .doc-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 8px;
    outline: none;
    padding: 2px 0;
    line-height: 1.55;
    border-bottom: 1.5px dashed transparent;
  }

  /* Bento Grid Layout */
  .bento-grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 16px;
  }

  /* Bento Card Items */
  .bento-card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel);
    padding: 24px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    cursor: grab;
  }

  .bento-card:active {
    cursor: grabbing;
  }

  .bento-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }

  .bento-card.dragging {
    opacity: 0.4;
    transform: scale(0.98);
  }

  .bento-card.drag-over {
    border: 2px dashed var(--accent);
  }

  /* Grid Spans */
  .span-1x1 { grid-column: span 6; min-height: 220px; }
  .span-2x1 { grid-column: span 12; min-height: 220px; }
  .span-1x2 { grid-column: span 6; min-height: 420px; }
  .span-2x2 { grid-column: span 12; min-height: 420px; }

  @media (max-width: 900px) {
    .span-1x1, .span-1x2, .span-2x1, .span-2x2 { grid-column: span 12; }
  }

  /* Bottom Floating Card Toolbar */
  .card-toolbar {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    background: rgba(255, 255, 255, 0.92);
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    z-index: 20;
    backdrop-filter: blur(8px);
  }
  body.dark-theme .card-toolbar {
    background: rgba(23, 27, 34, 0.92);
  }

  .bento-card:hover .card-toolbar {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .tool-btn {
    min-height: 28px;
    padding: 0 8px;
    font-size: 11px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted);
  }
  .tool-btn:hover { color: var(--text-main); background: rgba(0,0,0,0.06); }
  body.dark-theme .tool-btn:hover { background: rgba(255,255,255,0.1); }

  /* Card Inner Contents */
  .card-kicker {
    font-size: 11px;
    font-weight: 750;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    outline: none;
  }

  .card-title {
    font-size: 18px;
    font-weight: 750;
    color: var(--text-main);
    outline: none;
    margin-bottom: 8px;
  }

  .card-body {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.55;
    outline: none;
    flex: 1;
  }

  /* Metric Card Style */
  .metric-number {
    font-size: 46px;
    font-weight: 850;
    letter-spacing: -0.05em;
    line-height: 1;
    margin: 12px 0 6px;
    color: var(--accent);
    outline: none;
  }

  /* Dark Variant Card */
  .bento-card.dark-card {
    background: var(--dark-panel);
    color: var(--dark-text);
    border-color: rgba(255,255,255,0.1);
  }
  .bento-card.dark-card .card-title { color: #fff; }
  .bento-card.dark-card .card-body { color: rgba(255,255,255,0.65); }

  /* Code Block Spec */
  .code-block {
    background: #11141a;
    color: #84d8ff;
    padding: 14px;
    border-radius: 12px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    margin-top: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    outline: none;
    white-space: pre-wrap;
  }

  /* Diff Block */
  .diff-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .diff-box {
    padding: 12px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.5;
    outline: none;
  }
  .diff-old { background: rgba(255, 117, 117, 0.1); border: 1px solid rgba(255, 117, 117, 0.2); color: #ff7575; }
  .diff-new { background: rgba(123, 216, 143, 0.1); border: 1px solid rgba(123, 216, 143, 0.2); color: #2f8f5b; }

  /* Notice / Alert Block */
  .alert-box {
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(246, 199, 110, 0.12);
    border: 1px solid rgba(246, 199, 110, 0.3);
    color: #d97706;
    font-size: 12px;
    margin-top: 10px;
    outline: none;
  }

  /* Checklist Block */
  .checklist {
    display: grid;
    gap: 8px;
    margin-top: 10px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-main);
  }
  .check-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .check-item-text { flex: 1; outline: none; }
  .check-item-del {
    border: none;
    background: transparent;
    color: #a59b8e;
    padding: 0 4px;
    min-height: auto;
    font-size: 14px;
  }
  .check-item-del:hover { color: #e5484d; }

  .add-check-btn {
    margin-top: 8px;
    min-height: 28px;
    padding: 0 8px;
    font-size: 11px;
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
  }
  .add-check-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Toast Notification */
  .toast {
    position: fixed;
    z-index: 100;
    right: 20px;
    bottom: 20px;
    padding: 10px 18px;
    border-radius: 10px;
    background: var(--dark-panel);
    color: var(--dark-text);
    font-size: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <b>🍱</b>
    <h1>Bento Doc Builder</h1>
  </div>
  <div class="header-actions">
    <button onclick="toggleTheme()">🌓 切换主题</button>
    <button onclick="addCard('metric')">➕ 指标卡</button>
    <button onclick="addCard('graphic')">➕ 图文卡</button>
    <button onclick="addCard('code')">➕ 代码卡</button>
    <button onclick="addCard('diff')">➕ 对比卡</button>
    <button onclick="addCard('notice')">➕ 警示卡</button>
    <button onclick="exportJson()">💾 保存草稿 JSON</button>
    <button onclick="document.getElementById('jsonFileInput').click()">📂 载入草稿</button>
    <button class="accent" onclick="exportStandaloneHtml()">🚀 导出独立 HTML 网页</button>
  </div>
</header>

<input type="file" id="jsonFileInput" accept=".json" style="display:none" onchange="handleFileImport(event)" />

<!-- Onboarding Hint Banner -->
<div class="onboarding-banner" id="hintBanner">
  <span>💡 提示：所有文字均可直接点击编辑 · 拖拽卡片调整排序 · 悬停卡片底部可切换尺寸与主题</span>
  <button onclick="document.getElementById('hintBanner').style.display='none'">✕</button>
</div>

<main class="doc-container">
  <!-- Document Metadata Header -->
  <section class="doc-header-block">
    <div class="doc-meta-tags" id="docTags">
      <span class="tag-badge" contenteditable="true">P0 核心需求</span>
      <span class="tag-badge" contenteditable="true">IoT 平台 v2.4</span>
      <span class="tag-badge" contenteditable="true">茶饮机/咖啡机专有</span>
    </div>
    <div class="doc-title" contenteditable="true" id="docTitle">茶饮机全自动校准 PRD (上线说明文档)</div>
    <div class="doc-subtitle" contenteditable="true" id="docSubtitle">实现多料仓脉冲精确扣减、出料误差动态补偿算法与闭环 CIP 清洗提醒功能。</div>
  </section>

  <!-- Bento Grid Cards Container -->
  <div class="bento-grid" id="bentoGrid">
    <!-- Rendered by JS -->
  </div>
</main>

<div class="toast" id="toastMsg"></div>

<script>
  let cards = [
    {
      id: 'c1',
      type: 'metric',
      span: 'span-1x1',
      dark: false,
      kicker: 'CORE METRIC',
      title: '出料精确度升至 99.8%',
      number: '99.8%',
      body: '通过引入下料脉冲闭环与算法补偿，平均出料误差由上一代的 1.2g 降低至 0.02g。'
    },
    {
      id: 'c2',
      type: 'code',
      span: 'span-1x1',
      dark: true,
      kicker: 'THING MODEL SPEC',
      title: 'MQTT 属性与下发协议',
      body: '平台与上位机通信的 MQTT 上报 JSON 格式规范：',
      code: '{\n  "device_id": "TEA-MAKER-09",\n  "silo_id": 3,\n  "pulse_count": 450,\n  "calibration_status": 1,\n  "error_rate": 0.002\n}'
    },
    {
      id: 'c3',
      type: 'diff',
      span: 'span-2x1',
      dark: false,
      kicker: 'ALGORITHM COMPARISON',
      title: '出料扣减算法新旧对比',
      body: '展示新版脉冲反馈补偿与旧版固定时间扣减的核心差异：',
      oldText: '❌ 旧逻辑：按定时器固定毫秒扣减，原料密度变化时产生高达 8% 的累计出料偏差。',
      newText: '✅ 新逻辑：按传感器脉冲实时闭环，支持按气温与损耗系数动态做算法衰减补偿。'
    },
    {
      id: 'c4',
      type: 'notice',
      span: 'span-1x1',
      dark: false,
      kicker: 'BOUNDARY & WARNING',
      title: '缺料预警与边界条件限制',
      body: '当任一料仓余量低于 15% 阈值时触发：',
      alert: '⚠️ 注意：缺料告警触发后，系统将自动向 POS 侧广播“低余量”提示，但不会中断当前正在进行的出杯。'
    },
    {
      id: 'c5',
      type: 'checklist',
      span: 'span-1x1',
      dark: false,
      kicker: 'SOP CHECKLIST',
      title: '上线与联调确认清单',
      body: '部署前请依次确认以下步骤：',
      items: ['物模型属性 Topic 验证通过', '灰度 5 台连锁门店设备观察', '确认失败自动回滚逻辑执行成功']
    }
  ];

  function showToast(msg) {
    const t = document.getElementById('toastMsg');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2600);
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-theme');
    showToast('已切换主题视图');
  }

  // Smooth DOM-based Card Spans Cycle (No full innerHTML destroy)
  function cycleSpan(id) {
    const spans = ['span-1x1', 'span-2x1', 'span-1x2', 'span-2x2'];
    const spanNames = { 'span-1x1': '1x1 标准', 'span-2x1': '2x1 横卡', 'span-1x2': '1x2 纵卡', 'span-2x2': '2x2 大卡' };
    const cardEl = document.getElementById(id);
    const c = cards.find(x => x.id === id);
    if (cardEl && c) {
      const currIdx = spans.indexOf(c.span);
      const nextSpan = spans[(currIdx + 1) % spans.length];
      cardEl.classList.remove(c.span);
      cardEl.classList.add(nextSpan);
      c.span = nextSpan;
      showToast(`切换尺寸: ${spanNames[nextSpan]}`);
    }
  }

  // Smooth Dark Mode Toggle on specific card
  function toggleDark(id) {
    const cardEl = document.getElementById(id);
    const c = cards.find(x => x.id === id);
    if (cardEl && c) {
      c.dark = !c.dark;
      cardEl.classList.toggle('dark-card', c.dark);
    }
  }

  function removeCard(id) {
    const cardEl = document.getElementById(id);
    if (cardEl) {
      cardEl.remove();
      cards = cards.filter(x => x.id !== id);
      showToast('已移除卡片');
    }
  }

  function addChecklistItem(id) {
    const c = cards.find(x => x.id === id);
    if (c) {
      if (!c.items) c.items = [];
      c.items.push('新增确认步骤');
      renderGrid();
    }
  }

  function removeChecklistItem(cardId, idx) {
    const c = cards.find(x => x.id === cardId);
    if (c && c.items) {
      c.items.splice(idx, 1);
      renderGrid();
    }
  }

  // Drag and Drop State
  let draggedCardId = null;

  function handleDragStart(e) {
    draggedCardId = this.id;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('drag-over');
  }

  function handleDragLeave(e) {
    this.classList.remove('drag-over');
  }

  function handleDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    if (draggedCardId && draggedCardId !== this.id) {
      const fromIdx = cards.findIndex(x => x.id === draggedCardId);
      const toIdx = cards.findIndex(x => x.id === this.id);
      if (fromIdx !== -1 && toIdx !== -1) {
        const movedItem = cards.splice(fromIdx, 1)[0];
        cards.splice(toIdx, 0, movedItem);
        renderGrid();
        showToast('已调整卡片顺序');
      }
    }
  }

  function handleDragEnd() {
    this.classList.remove('dragging');
    document.querySelectorAll('.bento-card').forEach(el => el.classList.remove('drag-over'));
  }

  function renderGrid() {
    const grid = document.getElementById('bentoGrid');
    grid.innerHTML = cards.map((card) => {
      let contentHtml = '';

      if (card.type === 'metric') {
        contentHtml = `
          <div class="metric-number" contenteditable="true" onblur="card.number=this.innerText">${card.number}</div>
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
        `;
      } else if (card.type === 'code') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="code-block" contenteditable="true" onblur="card.code=this.innerText">${card.code || ''}</div>
        `;
      } else if (card.type === 'diff') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="diff-container">
            <div class="diff-box diff-old" contenteditable="true" onblur="card.oldText=this.innerText">${card.oldText}</div>
            <div class="diff-box diff-new" contenteditable="true" onblur="card.newText=this.innerText">${card.newText}</div>
          </div>
        `;
      } else if (card.type === 'notice') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="alert-box" contenteditable="true" onblur="card.alert=this.innerText">${card.alert}</div>
        `;
      } else if (card.type === 'checklist') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="checklist">
            ${(card.items || []).map((item, itemIdx) => `
              <div class="check-item">
                <input type="checkbox" checked />
                <span class="check-item-text" contenteditable="true" onblur="card.items[${itemIdx}]=this.innerText">${item}</span>
                <button class="check-item-del" onclick="removeChecklistItem('${card.id}', ${itemIdx})">✕</button>
              </div>
            `).join('')}
            <button class="add-check-btn" onclick="addChecklistItem('${card.id}')">➕ 添加确认项</button>
          </div>
        `;
      } else {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
        `;
      }

      return `
        <div class="bento-card ${card.span} ${card.dark ? 'dark-card' : ''}" id="${card.id}" draggable="true">
          <div>
            <div class="card-kicker" contenteditable="true" onblur="card.kicker=this.innerText">${card.kicker}</div>
            <div class="card-title" contenteditable="true" onblur="card.title=this.innerText">${card.title}</div>
            ${contentHtml}
          </div>
          <div class="card-toolbar">
            <button class="tool-btn" onclick="cycleSpan('${card.id}')">📐 尺寸</button>
            <button class="tool-btn" onclick="toggleDark('${card.id}')">🎨 暗黑</button>
            <button class="tool-btn" onclick="removeCard('${card.id}')">❌ 删除</button>
          </div>
        </div>
      `;
    }).join('');

    // Attach Drag and Drop Event Listeners
    document.querySelectorAll('.bento-card').forEach(cardEl => {
      cardEl.addEventListener('dragstart', handleDragStart);
      cardEl.addEventListener('dragover', handleDragOver);
      cardEl.addEventListener('dragleave', handleDragLeave);
      cardEl.addEventListener('drop', handleDrop);
      cardEl.addEventListener('dragend', handleDragEnd);
    });
  }

  function addCard(type) {
    const id = 'c' + Date.now();
    if (type === 'metric') {
      cards.push({ id, type, span: 'span-1x1', kicker: 'METRIC', title: '新增数据指标', number: '100%', body: '描述文字说明。' });
    } else if (type === 'code') {
      cards.push({ id, type, span: 'span-1x1', dark: true, kicker: 'CODE SPEC', title: '协议格式规范', body: '数据描述：', code: '{\n  "status": "ok"\n}' });
    } else if (type === 'diff') {
      cards.push({ id, type, span: 'span-2x1', kicker: 'COMPARISON', title: '逻辑对比规则', body: '说明文字：', oldText: '❌ 旧逻辑：说明', newText: '✅ 新逻辑：说明' });
    } else if (type === 'notice') {
      cards.push({ id, type, span: 'span-1x1', kicker: 'ALERT', title: '注意事项与限制', body: '说明：', alert: '⚠️ 注意提示内容' });
    } else {
      cards.push({ id, type: 'graphic', span: 'span-1x1', kicker: 'FEATURE', title: '新特性说明', body: '详细图文内容与描述。' });
    }
    renderGrid();
    showToast('已添加新卡片');
  }

  function exportJson() {
    const data = {
      title: document.getElementById('docTitle').innerText,
      subtitle: document.getElementById('docSubtitle').innerText,
      cards
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${data.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_')}_草稿.json`;
    a.click();
    showToast('已导出 JSON 草稿文件');
  }

  function handleFileImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.title) document.getElementById('docTitle').innerText = data.title;
        if (data.subtitle) document.getElementById('docSubtitle').innerText = data.subtitle;
        if (Array.isArray(data.cards)) cards = data.cards;
        renderGrid();
        showToast('草稿载入成功');
      } catch {
        alert('解析草稿 JSON 失败，请检查文件格式');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function exportStandaloneHtml() {
    const title = document.getElementById('docTitle').innerText;
    const htmlContent = document.documentElement.outerHTML
      .replace(/<header>[\s\S]*?<\/header>/, '<header style="padding: 16px 32px; background: var(--panel); border-bottom: 1px solid var(--border);"><h2 style="font-size:16px;">🍱 ' + title + '</h2></header>')
      .replace(/<div class="onboarding-banner"[\s\S]*?<\/div>/, '')
      .replace(/card-toolbar/g, 'card-toolbar-hidden')
      .replace(/contenteditable="true"/g, '')
      .replace(/draggable="true"/g, '');

    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_')}.html`;
    a.click();
    showToast('已导出独立 HTML 网页！');
  }

  renderGrid();
</script>

</body>
</html>
