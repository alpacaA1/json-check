<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Local Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-page:      #F2F0EA;
        --bg-panel:     #FAF9F5;
        --bg-hover:     #EAE7DF;
        --bg-selected:  #DDD9CF;
        --text-primary:   #171714;
        --text-secondary: #66645E;
        --text-muted:     #929087;
        --divider:        #D5D2C9;
        --accent:         #D94A2B;
        --error:          #B42318;
        --success:        #3F6B4C;
      }
      body {
        font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-page);
        color: var(--text-primary);
      }
      .font-mono {
        font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
      }
      .transition-colors {
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      }
      .fade-in {
        animation: fadeIn 150ms ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body class="h-screen flex flex-col overflow-hidden bg-[#F2F0EA] text-[#171714]">
    <!-- 顶部工具栏 -->
    <header class="h-16 shrink-0 border-b border-[#D5D2C9] flex items-center justify-between px-6 bg-[#FAF9F5]">
      <div class="flex items-center gap-4">
        <div>
          <h1 class="font-mono text-[11px] font-[600] uppercase tracking-wider text-[#171714]">
            技能 / 本地注册表
          </h1>
          <p class="text-[12px] text-[#66645E] mt-0.5">
            管理本机安装的能力与触发方式
          </p>
        </div>
      </div>

      <div class="flex items-center gap-6">
        <div class="flex items-center gap-5 font-mono text-[11px] text-[#66645E]" id="stats-counter">
          <span><strong class="text-[#171714]" id="cnt-installed">0</strong> 已安装</span>
          <span><strong class="text-[#171714]" id="cnt-enabled">0</strong> 已启用</span>
          <span><strong class="text-[#D94A2B]" id="cnt-error">0</strong> 异常</span>
        </div>

        <div class="flex items-center gap-3">
          <input
            type="text"
            id="search-input"
            oninput="handleSearch(this.value)"
            placeholder="搜索名称、描述或命令…"
            class="w-[240px] bg-[#F2F0EA] text-[13px] px-3 py-1.5 rounded border border-[#D5D2C9] focus:outline-none focus:border-[#171714] placeholder-[#929087]"
          />
          <button
            onclick="handleRefresh()"
            class="text-[11px] font-mono text-[#66645E] hover:text-[#171714] cursor-pointer"
          >
            刷新
          </button>
        </div>
      </div>
    </header>

    <!-- 主体区域 -->
    <div class="flex-1 flex overflow-hidden">
      <!-- 左侧列表 -->
      <aside class="w-[380px] shrink-0 border-r border-[#D5D2C9] bg-[#FAF9F5] flex flex-col h-full">
        <!-- 筛选栏 -->
        <div class="flex gap-4 px-4 py-2 border-b border-[#D5D2C9] font-mono text-[11px] shrink-0" id="filter-bar">
          <button onclick="setFilter('all')" id="filter-all" class="relative pb-1 cursor-pointer text-[#171714] font-[600]">
            <span class="absolute left-0 bottom-0 w-full h-[2px] bg-[#D94A2B] filter-line"></span>
            全部 <span id="tab-cnt-all">0</span>
          </button>
          <button onclick="setFilter('normal')" id="filter-normal" class="relative pb-1 cursor-pointer text-[#66645E] hover:text-[#171714]">
            普通型 <span id="tab-cnt-normal">0</span>
          </button>
          <button onclick="setFilter('command')" id="filter-command" class="relative pb-1 cursor-pointer text-[#66645E] hover:text-[#171714]">
            命令型 <span id="tab-cnt-command">0</span>
          </button>
          <button onclick="setFilter('disabled')" id="filter-disabled" class="relative pb-1 cursor-pointer text-[#66645E] hover:text-[#171714]">
            已停用 <span id="tab-cnt-disabled">0</span>
          </button>
          <button onclick="setFilter('error')" id="filter-error" class="relative pb-1 cursor-pointer text-[#B42318] hover:opacity-80">
            异常 <span id="tab-cnt-error">0</span>
          </button>
        </div>

        <!-- 列表容器 -->
        <div class="flex-1 overflow-y-auto" id="skills-list"></div>
      </aside>

      <!-- 右侧详情 -->
      <main class="flex-1 overflow-y-auto bg-[#FAF9F5]" id="skill-detail"></main>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-[#171714] text-white text-[13px] px-4 py-2.5 rounded fade-in z-50 shadow-sm font-sans hidden"></div>

    <script>

      const STORAGE_KEY = 'skills-enabled-state';

      // CLI 注册表 —— 多个 AI 编码 CLI 共用 skills
      const CLI_REGISTRY = [
        { id: 'claude',  name: 'Claude Code', short: 'CC', color: '#D97757' },
        { id: 'codex',   name: 'Codex',       short: 'CX', color: '#1A1A1A' },
        { id: 'opencode',name: 'OpenCode',    short: 'OC', color: '#3B82F6' }
      ];

      // 每个 Skill 默认共享给哪些 CLI
      const SKILL_CLI_MAP = {
        // Shared (~/.agents/skills/)
        'check':['claude','codex','opencode'], 'design':['claude','codex','opencode'],
        'frontend-design':['claude','codex','opencode'], 'health':['claude','codex','opencode'],
        'hunt':['claude','codex','opencode'], 'impeccable':['claude','codex','opencode'],
        'iot-prd-writer':['claude','codex','opencode'], 'kami':['claude','codex','opencode'],
        'learn':['claude','codex','opencode'],
        'mo-auth':['claude','codex','opencode'], 'mo-discover':['claude','codex','opencode'],
        'mo-misc':['claude','codex','opencode'], 'mo-note':['claude','codex','opencode'],
        'mo-remark':['claude','codex','opencode'], 'mo-shared':['claude','codex','opencode'],
        'mo-user':['claude','codex','opencode'],
        'prd-gatekeeper':['claude','codex','opencode'], 'product-manager-toolkit':['claude','codex','opencode'],
        'read':['claude','codex','opencode'], 'report-generator':['claude','codex','opencode'],
        'requirements-to-sop':['claude','codex','opencode'], 'think':['claude','codex','opencode'],
        'ui-pattern-scout':['claude','codex','opencode'], 'write':['claude','codex','opencode'],
        'write-a-':['claude','codex','opencode'],
        // Claude + Codex
        'html-visual-output':['claude','codex'],
        // Codex only
        'gsap-core':['codex'], 'gsap-react':['codex'], 'page-layout-guidelines':['codex']
      };

      let currentSkills = [];
      let currentFilter = 'all';
      let searchQuery = '';
      let selectedSkillId = 'check';
      let editMode = false;
      let editData = {};

      function validateSkill(skill) {
        if (skill.type === 'normal') {
          if (skill.autoTrigger !== true) {
            return { valid: false, error: '普通型 Skill 必须配置 autoTrigger = true' };
          }
          if (skill.command !== null) {
            return { valid: false, error: '普通型 Skill 的 command 必须为 null' };
          }
        }
        if (skill.type === 'command') {
          if (skill.autoTrigger !== false) {
            return { valid: false, error: '命令型 Skill 必须配置 autoTrigger = false' };
          }
          if (!skill.command || !skill.command.startsWith('/')) {
            return { valid: false, error: '命令型 Skill 必须配置以 "/" 开头的 command' };
          }
        }
        return { valid: true, error: null };
      }

      function loadFromStorage() {
        // 先把 CLI 数据合并进 INITIAL_SKILLS
        const mergeClis = (skills) => skills.map(s => ({
          ...s,
          clis: [...(SKILL_CLI_MAP[s.id] || ['claude', 'codex', 'opencode'])]
        }));

        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            currentSkills = mergeClis(INITIAL_SKILLS);
            return;
          }
          const storedState = JSON.parse(raw);
          currentSkills = mergeClis(INITIAL_SKILLS);
          currentSkills.forEach(s => {
            const saved = storedState[s.id];
            if (!saved) return;
            if (typeof saved.enabled === 'boolean') s.enabled = saved.enabled;
            if (saved.type) {
              s.type = saved.type;
              s.autoTrigger = saved.type === 'normal';
            }
            if (typeof saved.command === 'string' || saved.command === null) {
              s.command = saved.command;
            }
            if (saved.commandUsage !== undefined) {
              s.commandUsage = saved.commandUsage;
            }
            if (Array.isArray(saved.clis)) {
              s.clis = [...saved.clis];
            }
          });
        } catch (e) {
          currentSkills = mergeClis(INITIAL_SKILLS);
        }
      }

      function saveToStorage() {
        try {
          const stateToSave = {};
          currentSkills.forEach(s => {
            stateToSave[s.id] = {
              enabled: s.enabled,
              type: s.type,
              command: s.command,
              commandUsage: s.commandUsage || null,
              clis: s.clis || []
            };
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
        } catch (e) {
          console.error('Failed to save state', e);
        }
      }

      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('hidden');
        if (window._toastTimer) clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => {
          toast.classList.add('hidden');
        }, 2500);
      }

      function handleSearch(val) {
        searchQuery = val.trim().toLowerCase();
        renderList();
      }

      function handleRefresh() {
        showToast('已刷新配置状态');
        render();
      }

      function setFilter(f) {
        currentFilter = f;
        renderTabs();
        renderList();
      }

      function clearFilters() {
        currentFilter = 'all';
        searchQuery = '';
        document.getElementById('search-input').value = '';
        renderTabs();
        renderList();
      }

      function selectSkill(id) {
        selectedSkillId = id;
        renderList();
        renderDetail();
      }

      function toggleEnable(id, event) {
        if (event) event.stopPropagation();
        const skill = currentSkills.find(s => s.id === id);
        if (!skill) return;

        const v = validateSkill(skill);
        if (!v.valid) {
          showToast(v.error || '配置异常，无法启用');
          return;
        }

        skill.enabled = !skill.enabled;
        saveToStorage();

        if (skill.type === 'normal') {
          showToast(skill.enabled ? '已允许该 Skill 根据对话内容自动匹配。' : '该 Skill 已退出自动匹配。');
        } else {
          showToast(skill.enabled ? ('已启用，输入 ' + skill.command + ' 可调用该 Skill。') : '该命令已停用，输入命令也不会调用。');
        }

        renderStats();
        renderTabs();
        renderList();
        renderDetail();
      }

      function copyText(txt) {
        navigator.clipboard.writeText(txt).then(() => {
          showToast('已复制到剪贴板');
        }).catch(() => {
          showToast('复制失败');
        });
      }

      // ===== 编辑模式 =====

      function enterEdit() {
        const s = currentSkills.find(item => item.id === selectedSkillId);
        if (!s) return;
        editMode = true;
        editData = {
          type: s.type,
          command: s.command || '',
          commandUsage: s.commandUsage || '',
          clis: [...(s.clis || [])]
        };
        renderDetail();
      }

      function cancelEdit() {
        editMode = false;
        editData = {};
        renderDetail();
      }

      function saveEdit() {
        const s = currentSkills.find(item => item.id === selectedSkillId);
        if (!s) return;

        // 应用编辑
        s.type = editData.type;
        if (editData.type === 'normal') {
          s.autoTrigger = true;
          s.command = null;
          s.commandUsage = null;
        } else {
          s.autoTrigger = false;
          s.command = editData.command.trim();
          s.commandUsage = editData.commandUsage.trim() || s.command;
        }
        s.clis = [...editData.clis];

        // 校验
        const v = validateSkill(s);
        if (!v.valid) {
          showToast(v.error || '配置异常，请检查');
          // 仍然保存但禁用
          if (s.enabled) s.enabled = false;
        } else {
          showToast('配置已保存');
        }

        saveToStorage();
        editMode = false;
        editData = {};
        render();
      }

      function updateEditType(type) {
        editData.type = type;
        if (type === 'normal') {
          editData.command = '';
          editData.commandUsage = '';
        } else if (!editData.command) {
          const s = currentSkills.find(item => item.id === selectedSkillId);
          const defaultCmd = '/' + (s ? s.id : 'command');
          editData.command = defaultCmd;
          editData.commandUsage = defaultCmd;
        }
        renderDetail();
      }

      function updateEditField(field, val) {
        editData[field] = val;
      }

      function toggleEditCli(cliId) {
        const idx = editData.clis.indexOf(cliId);
        if (idx >= 0) {
          editData.clis.splice(idx, 1);
        } else {
          editData.clis.push(cliId);
        }
        renderDetail();
      }

      function getFilteredSkills() {
        return currentSkills.filter(s => {
          const v = validateSkill(s);
          if (currentFilter === 'normal' && s.type !== 'normal') return false;
          if (currentFilter === 'command' && s.type !== 'command') return false;
          if (currentFilter === 'disabled' && s.enabled !== false) return false;
          if (currentFilter === 'error' && v.valid) return false;

          if (searchQuery) {
            const haystack = (s.name + ' ' + s.description + ' ' + (s.command || '') + ' ' + s.path).toLowerCase();
            if (!haystack.includes(searchQuery)) return false;
          }
          return true;
        });
      }

      function renderStats() {
        let installed = currentSkills.length;
        let enabled = 0, errors = 0, normal = 0, command = 0, disabled = 0;
        currentSkills.forEach(s => {
          const v = validateSkill(s);
          if (!v.valid) errors++;
          if (s.type === 'normal') normal++;
          if (s.type === 'command') command++;
          if (s.enabled && v.valid) enabled++;
          if (!s.enabled) disabled++;
        });

        document.getElementById('cnt-installed').textContent = installed;
        document.getElementById('cnt-enabled').textContent = enabled;
        document.getElementById('cnt-error').textContent = errors;

        document.getElementById('tab-cnt-all').textContent = installed;
        document.getElementById('tab-cnt-normal').textContent = normal;
        document.getElementById('tab-cnt-command').textContent = command;
        document.getElementById('tab-cnt-disabled').textContent = disabled;
