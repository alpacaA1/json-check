<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Doc Builder · 视觉 PRD & 培训文档生成器</title>
<style>
  :root {
    --bg: #f5f0e8;
    --panel: #ffffff;
    --panel-hover: #fffdf9;
    --border: rgba(126, 105, 83, 0.18);
    --border-hover: rgba(223, 106, 75, 0.45);
    --text-main: #1f201d;
    --text-muted: #67645c;
    --accent: #df6a4b;
    --accent-dark: #9f3f2a;
    --accent-bg: #f2d6c9;
    --dark-panel: #242421;
    --dark-text: #fffdf9;
    --card-shadow: 0 1px 3px rgba(48,38,27,.06), 0 8px 24px rgba(48,38,27,.05);
  }

  body.dark-theme {
    --bg: #0f1115;
    --panel: #171b22;
    --panel-hover: #1e232d;
    --border: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(99, 102, 241, 0.55);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-dark: #818cf8;
    --accent-bg: rgba(99, 102, 241, 0.18);
    --dark-panel: #0b0d11;
    --dark-text: #f1f5f9;
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }

  button, input, textarea, select { font: inherit; }

  /* Header Controls Toolbar */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: rgba(255,255,255,0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
    gap: 12px;
  }
  body.dark-theme header {
    background: rgba(23, 27, 34, 0.92);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-brand b {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
  }

  .header-brand h1 {
    font-size: 16px;
    font-weight: 750;
    color: var(--text-main);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  button {
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  button:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  button.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  button.accent:hover { opacity: 0.92; }

  /* Onboarding Banner */
  .onboarding-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    background: var(--accent-bg);
    color: var(--accent-dark);
    font-size: 12px;
    font-weight: 600;
  }
  .onboarding-banner button {
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 14px;
    min-height: auto;
    padding: 0 4px;
  }

  /* Main Document Container */
  .doc-container {
    max-width: 1280px;
    margin: 0 auto;
    width: 100%;
    padding: 28px 24px 80px;
    flex: 1;
  }

  /* Document Meta Header */
  .doc-header-block {
    margin-bottom: 28px;
    padding: 28px 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--card-shadow);
  }

  .doc-meta-tags {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .tag-badge {
    padding: 4px 11px;
    border-radius: 20px;
    background: var(--accent-bg);
    color: var(--accent-dark);
    font-size: 11px;
    font-weight: 700;
    outline: none;
  }

  .doc-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.03em;
    outline: none;
    padding: 4px 0;
    border-bottom: 1.5px dashed transparent;
    transition: border-color 0.2s;
  }

  .doc-title:focus, .doc-subtitle:focus, [contenteditable="true"]:focus {
    border-bottom-color: var(--accent) !important;
  }

  .doc-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 8px;
    outline: none;
    padding: 2px 0;
    line-height: 1.55;
    border-bottom: 1.5px dashed transparent;
  }

  /* Bento Grid Layout */
  .bento-grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 16px;
  }

  /* Bento Card Items */
  .bento-card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel);
    padding: 24px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .bento-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }

  .bento-card.dragging {
    opacity: 0.4;
    transform: scale(0.98);
  }

  .bento-card.drag-over {
    border: 2px dashed var(--accent);
  }

  /* Grid Fractional Spans */
  .span-05x { grid-column: span 3; min-height: 180px; padding: 18px; } /* 0.5x 迷你卡 (1/4宽) */
  .span-075x { grid-column: span 4; min-height: 190px; padding: 20px; } /* 0.75x 紧凑卡 (1/3宽) */
  .span-1x1 { grid-column: span 6; min-height: 220px; }                /* 1.0x 标准卡 (1/2宽) */
  .span-15x { grid-column: span 9; min-height: 220px; }                /* 1.5x 宽屏卡 (3/4宽) */
  .span-2x1 { grid-column: span 12; min-height: 220px; }               /* 2.0x 整行卡 (全宽) */
  .span-1x2 { grid-column: span 6; min-height: 420px; }                /* 1x2 纵向加高卡 */
  .span-2x2 { grid-column: span 12; min-height: 420px; }               /* 2x2 超大方卡 */

  @media (max-width: 900px) {
    .span-05x, .span-075x, .span-1x1, .span-15x, .span-1x2, .span-2x1, .span-2x2 { grid-column: span 12; }
  }

  /* Bottom Compact Floating Card Toolbar (Never Wrap) */
  .card-toolbar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
    max-width: calc(100% - 16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    background: rgba(255, 255, 255, 0.96);
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    z-index: 20;
    backdrop-filter: blur(10px);
  }
  body.dark-theme .card-toolbar {
    background: rgba(23, 27, 34, 0.96);
  }

  .bento-card:hover .card-toolbar {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .drag-handle {
    cursor: grab;
    padding: 0 4px;
    color: var(--text-muted);
    font-size: 13px;
    user-select: none;
    display: flex;
    align-items: center;
  }
  .drag-handle:active { cursor: grabbing; }

  .tool-btn-icon {
    min-height: 26px;
    width: 26px;
    padding: 0;
    font-size: 12px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tool-btn-icon:hover { color: var(--text-main); background: rgba(0,0,0,0.06); }
  body.dark-theme .tool-btn-icon:hover { background: rgba(255,255,255,0.1); }
  .tool-btn-icon.del-btn:hover { color: #e5484d; background: rgba(229, 72, 77, 0.1); }

  /* Sleek Custom Select Dropdown UI */
  .size-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .size-select {
    appearance: none;
    -webkit-appearance: none;
    min-height: 26px;
    padding: 0 18px 0 8px;
    font-size: 11px;
    font-weight: 650;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
    color: var(--text-main);
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .size-select:hover {
    border-color: var(--border-hover);
    background: var(--panel-hover);
  }
  .size-select-arrow {
    position: absolute;
    right: 6px;
    pointer-events: none;
    font-size: 9px;
    color: var(--text-muted);
  }

  /* Card Inner Contents */
  .card-kicker {
    font-size: 11px;
    font-weight: 750;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    outline: none;
  }

  .card-title {
    font-size: 18px;
    font-weight: 750;
    color: var(--text-main);
    outline: none;
    margin-bottom: 8px;
  }

  .card-body {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.55;
    outline: none;
    flex: 1;
  }

  /* Metric Card Style */
  .metric-number {
    font-size: 44px;
    font-weight: 850;
    letter-spacing: -0.05em;
    line-height: 1;
    margin: 10px 0 6px;
    color: var(--accent);
    outline: none;
  }
  .span-05x .metric-number { font-size: 32px; }

  /* Image Upload Zone inside Graphic Card */
  .image-dropzone {
    margin-top: 10px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    background: rgba(0,0,0,0.02);
    transition: background 0.2s, border-color 0.2s;
  }
  .image-dropzone:hover {
    border-color: var(--accent);
    background: rgba(223, 106, 75, 0.05);
  }
  .image-dropzone p {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .card-img-preview {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 10px;
    display: block;
  }
  .img-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  /* Link Card Spec */
  .link-card-box {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--accent-bg);
    color: var(--accent-dark);
    text-decoration: none;
    font-weight: 700;
    font-size: 12px;
  }

  /* Member Avatar Card Spec */
  .member-box {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .member-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 14px;
  }

  /* Timeline Card Spec */
  .timeline-list {
    display: grid;
    gap: 8px;
    margin-top: 10px;
    position: relative;
    padding-left: 14px;
    border-left: 2px solid var(--border);
  }
  .timeline-item {
    position: relative;
    font-size: 12px;
  }
  .timeline-item:before {
    content: "";
    position: absolute;
    left: -19px;
    top: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Dark Variant Card */
  .bento-card.dark-card {
    background: var(--dark-panel);
    color: var(--dark-text);
    border-color: rgba(255,255,255,0.1);
  }
  .bento-card.dark-card .card-title { color: #fff; }
  .bento-card.dark-card .card-body { color: rgba(255,255,255,0.65); }

  /* Code Block Spec */
  .code-block {
    background: #11141a;
    color: #84d8ff;
    padding: 12px;
    border-radius: 10px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
    margin-top: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    outline: none;
    white-space: pre-wrap;
  }

  /* Diff Block */
  .diff-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .diff-box {
    padding: 10px;
    border-radius: 8px;
    font-size: 11px;
    line-height: 1.5;
    outline: none;
  }
  .diff-old { background: rgba(255, 117, 117, 0.1); border: 1px solid rgba(255, 117, 117, 0.2); color: #ff7575; }
  .diff-new { background: rgba(123, 216, 143, 0.1); border: 1px solid rgba(123, 216, 143, 0.2); color: #2f8f5b; }

  /* Notice / Alert Block */
  .alert-box {
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(246, 199, 110, 0.12);
    border: 1px solid rgba(246, 199, 110, 0.3);
    color: #d97706;
    font-size: 11px;
    margin-top: 8px;
    outline: none;
  }

  /* Checklist Block */
  .checklist {
    display: grid;
    gap: 6px;
    margin-top: 8px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-main);
  }
  .check-item input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
  .check-item-text { flex: 1; outline: none; }
  .check-item-del {
    border: none;
    background: transparent;
    color: #a59b8e;
    padding: 0 4px;
    min-height: auto;
    font-size: 13px;
  }
  .check-item-del:hover { color: #e5484d; }

  .add-check-btn {
    margin-top: 6px;
    min-height: 26px;
    padding: 0 8px;
    font-size: 11px;
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
  }
  .add-check-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Toast Notification */
  .toast {
    position: fixed;
    z-index: 100;
    right: 20px;
    bottom: 20px;
    padding: 10px 18px;
    border-radius: 10px;
    background: var(--dark-panel);
    color: var(--dark-text);
    font-size: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <b>🍱</b>
    <h1>Bento Doc Builder</h1>
  </div>
  <div class="header-actions">
    <button onclick="toggleTheme()">🌓 主题</button>
    <button onclick="addCard('metric', 'span-05x')">➕ 0.5x 指标</button>
    <button onclick="addCard('graphic', 'span-1x1')">➕ 图文卡</button>
    <button onclick="addCard('code', 'span-075x')">➕ 代码卡</button>
    <button onclick="addCard('diff', 'span-2x1')">➕ 对比卡</button>
    <button onclick="addCard('notice', 'span-075x')">➕ 警示卡</button>
    <button onclick="addCard('checklist', 'span-1x1')">➕ 清单卡</button>
    <button onclick="addCard('link', 'span-05x')">➕ 外链卡</button>
    <button onclick="addCard('member', 'span-05x')">➕ 负责人</button>
    <button onclick="addCard('timeline', 'span-075x')">➕ 时间线</button>
    <button onclick="exportJson()">💾 保存草稿</button>
    <button onclick="document.getElementById('jsonFileInput').click()">📂 载入草稿</button>
    <button class="accent" onclick="exportStandaloneHtml()">🚀 导出 HTML</button>
  </div>
</header>

<input type="file" id="jsonFileInput" accept=".json" style="display:none" onchange="handleFileImport(event)" />

<!-- Onboarding Hint Banner -->
<div class="onboarding-banner" id="hintBanner">
  <span>💡 支持 <b>0.5x 迷你卡 (1/4宽)</b> 与 <b>0.75x 紧凑卡 (1/3宽)</b> 等尺寸；按住 <b>⠿ 把手</b> 拖拽排序。</span>
  <button onclick="document.getElementById('hintBanner').style.display='none'">✕</button>
</div>

<main class="doc-container">
  <!-- Document Metadata Header -->
  <section class="doc-header-block">
    <div class="doc-meta-tags" id="docTags">
      <span class="tag-badge" contenteditable="true">P0 核心需求</span>
      <span class="tag-badge" contenteditable="true">IoT 平台 v2.4</span>
      <span class="tag-badge" contenteditable="true">茶饮机/咖啡机专有</span>
    </div>
    <div class="doc-title" contenteditable="true" id="docTitle">茶饮机全自动校准 PRD (上线说明文档)</div>
    <div class="doc-subtitle" contenteditable="true" id="docSubtitle">实现多料仓脉冲精确扣减、出料误差动态补偿算法与闭环 CIP 清洗提醒功能。</div>
  </section>

  <!-- Bento Grid Cards Container -->
  <div class="bento-grid" id="bentoGrid">
    <!-- Rendered by JS -->
  </div>
</main>

<div class="toast" id="toastMsg"></div>

<script>
  let cards = [
    {
      id: 'c1',
      type: 'metric',
      span: 'span-05x',
      dark: false,
      kicker: 'PRECISION',
      title: '出料精度',
      number: '99.8%',
      body: '误差降低至 0.02g。'
    },
    {
      id: 'c2',
      type: 'metric',
      span: 'span-05x',
      dark: false,
      kicker: 'SPEED',
      title: '校准耗时',
      number: '12s',
      body: '支持一键自动基线下发。'
    },
    {
      id: 'c3',
      type: 'code',
      span: 'span-075x',
      dark: true,
      kicker: 'SPEC PROTOCOL',
      title: 'MQTT 属性协议',
      body: '平台与上位机通信 JSON：',
      code: '{\n  "device_id": "TEA-09",\n  "pulse": 450,\n  "status": 1\n}'
    },
    {
      id: 'c4',
      type: 'diff',
      span: 'span-2x1',
      dark: false,
      kicker: 'ALGORITHM COMPARISON',
      title: '出料扣减算法新旧对比',
      body: '展示新版脉冲反馈补偿与旧版固定时间扣减的核心差异：',
      oldText: '❌ 旧逻辑：按定时器固定毫秒扣减，产生高达 8% 的偏差。',
      newText: '✅ 新逻辑：按传感器脉冲实时闭环，支持动态衰减补偿。'
    },
    {
      id: 'c5',
      type: 'graphic',
      span: 'span-1x2',
      dark: false,
      kicker: 'PROTOTYPE SCREENSHOT',
      title: '设备交互与校准界面原型',
      body: '点击或拖拽上传原型截图，方便直观展示 UI 布局：',
      imageUrl: ''
    },
    {
      id: 'c6',
      type: 'notice',
      span: 'span-075x',
      dark: false,
      kicker: 'BOUNDARY',
      title: '缺料预警限制',
      body: '余量低于 15% 时触发：',
      alert: '⚠️ 自动向 POS 侧广播“低余量”提示，不中断出杯。'
    },
    {
      id: 'c7',
      type: 'member',
      span: 'span-05x',
      dark: false,
      kicker: 'OWNER',
      title: '需求负责人',
      body: '接口变动请联系：',
      memberName: '张三',
      memberRole: 'IoT 产品线 Owner'
    }
  ];

  function showToast(msg) {
    const t = document.getElementById('toastMsg');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2600);
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-theme');
    showToast('已切换主题视图');
  }

  function changeSpan(id, newSpan) {
    const cardEl = document.getElementById(id);
    const c = cards.find(x => x.id === id);
    if (cardEl && c) {
      cardEl.classList.remove(c.span);
      cardEl.classList.add(newSpan);
      c.span = newSpan;
      showToast('已更改卡片尺寸');
    }
  }

  function toggleDark(id) {
    const cardEl = document.getElementById(id);
    const c = cards.find(x => x.id === id);
    if (cardEl && c) {
      c.dark = !c.dark;
      cardEl.classList.toggle('dark-card', c.dark);
    }
  }

  function removeCard(id) {
    const cardEl = document.getElementById(id);
    if (cardEl) {
      cardEl.remove();
      cards = cards.filter(x => x.id !== id);
      showToast('已移除卡片');
    }
  }

  function handleImageUpload(cardId, file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const c = cards.find(x => x.id === cardId);
      if (c) {
        c.imageUrl = e.target.result;
        renderGrid();
        showToast('图片上传成功');
      }
    };
    reader.readAsDataURL(file);
  }

  function removeImage(cardId) {
    const c = cards.find(x => x.id === cardId);
    if (c) {
      c.imageUrl = '';
      renderGrid();
      showToast('已移除图片');
    }
  }

  function addChecklistItem(id) {
    const c = cards.find(x => x.id === id);
    if (c) {
      if (!c.items) c.items = [];
      c.items.push('新增确认步骤');
      renderGrid();
    }
  }

  function removeChecklistItem(cardId, idx) {
    const c = cards.find(x => x.id === cardId);
    if (c && c.items) {
      c.items.splice(idx, 1);
      renderGrid();
    }
  }

  // Drag Handle Drag & Drop Implementation
  let draggedCardId = null;

  function handleDragStart(e) {
    const cardEl = e.target.closest('.bento-card');
    if (!cardEl) return;
    draggedCardId = cardEl.id;
    cardEl.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    e.preventDefault();
    const cardEl = e.target.closest('.bento-card');
    if (cardEl && cardEl.id !== draggedCardId) {
      cardEl.classList.add('drag-over');
    }
  }

  function handleDragLeave(e) {
    const cardEl = e.target.closest('.bento-card');
    if (cardEl) cardEl.classList.remove('drag-over');
  }

  function handleDrop(e) {
    e.preventDefault();
    const targetCardEl = e.target.closest('.bento-card');
    if (targetCardEl) targetCardEl.classList.remove('drag-over');
    if (draggedCardId && targetCardEl && draggedCardId !== targetCardEl.id) {
      const fromIdx = cards.findIndex(x => x.id === draggedCardId);
      const toIdx = cards.findIndex(x => x.id === targetCardEl.id);
      if (fromIdx !== -1 && toIdx !== -1) {
        const movedItem = cards.splice(fromIdx, 1)[0];
        cards.splice(toIdx, 0, movedItem);
        renderGrid();
        showToast('已调整卡片顺序');
      }
    }
  }

  function handleDragEnd(e) {
    const cardEl = e.target.closest('.bento-card');
    if (cardEl) cardEl.classList.remove('dragging');
    document.querySelectorAll('.bento-card').forEach(el => el.classList.remove('drag-over'));
  }

  function renderGrid() {
    const grid = document.getElementById('bentoGrid');
    grid.innerHTML = cards.map((card) => {
      let contentHtml = '';

      if (card.type === 'metric') {
        contentHtml = `
          <div class="metric-number" contenteditable="true" onblur="card.number=this.innerText">${card.number}</div>
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
        `;
      } else if (card.type === 'graphic') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          ${card.imageUrl ? `
            <div>
              <img class="card-img-preview" src="${card.imageUrl}" alt="Uploaded image" />
              <div class="img-actions">
                <button onclick="removeImage('${card.id}')">❌ 移除图片</button>
              </div>
            </div>
          ` : `
            <div class="image-dropzone" onclick="document.getElementById('imgInput_${card.id}').click()">
              🖼️ 点击上传图片 / 粘贴图片 URL
              <p>支持 JPG, PNG, GIF, SVG</p>
              <input type="file" id="imgInput_${card.id}" accept="image/*" style="display:none" onchange="handleImageUpload('${card.id}', this.files[0])" />
            </div>
          `}
        `;
      } else if (card.type === 'code') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="code-block" contenteditable="true" onblur="card.code=this.innerText">${card.code || ''}</div>
        `;
      } else if (card.type === 'diff') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="diff-container">
            <div class="diff-box diff-old" contenteditable="true" onblur="card.oldText=this.innerText">${card.oldText}</div>
            <div class="diff-box diff-new" contenteditable="true" onblur="card.newText=this.innerText">${card.newText}</div>
          </div>
        `;
      } else if (card.type === 'notice') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="alert-box" contenteditable="true" onblur="card.alert=this.innerText">${card.alert}</div>
        `;
      } else if (card.type === 'link') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <a class="link-card-box" href="${card.linkUrl || '#'}" target="_blank">
            <span contenteditable="true" onblur="card.linkTitle=this.innerText">${card.linkTitle || '点击查看 PRD 原型'}</span> ➔
          </a>
        `;
      } else if (card.type === 'member') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="member-box">
            <div class="member-avatar">${(card.memberName || '张')[0]}</div>
            <div>
              <strong contenteditable="true" onblur="card.memberName=this.innerText">${card.memberName || '张三'}</strong>
              <div style="font-size:11px; opacity:0.7;" contenteditable="true" onblur="card.memberRole=this.innerText">${card.memberRole || '需求负责人'}</div>
            </div>
          </div>
        `;
      } else if (card.type === 'timeline') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="timeline-list">
            <div class="timeline-item" contenteditable="true">2026-08-15: 需求评审</div>
            <div class="timeline-item" contenteditable="true">2026-08-30: 全量上线</div>
          </div>
        `;
      } else if (card.type === 'checklist') {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
          <div class="checklist">
            ${(card.items || []).map((item, itemIdx) => `
              <div class="check-item">
                <input type="checkbox" checked />
                <span class="check-item-text" contenteditable="true" onblur="card.items[${itemIdx}]=this.innerText">${item}</span>
                <button class="check-item-del" onclick="removeChecklistItem('${card.id}', ${itemIdx})">✕</button>
              </div>
            `).join('')}
            <button class="add-check-btn" onclick="addChecklistItem('${card.id}')">➕ 添加确认项</button>
          </div>
        `;
      } else {
        contentHtml = `
          <div class="card-body" contenteditable="true" onblur="card.body=this.innerText">${card.body}</div>
        `;
      }

      return `
        <div class="bento-card ${card.span} ${card.dark ? 'dark-card' : ''}" id="${card.id}">
          <div>
            <div class="card-kicker" contenteditable="true" onblur="card.kicker=this.innerText">${card.kicker}</div>
            <div class="card-title" contenteditable="true" onblur="card.title=this.innerText">${card.title}</div>
            ${contentHtml}
          </div>
          <div class="card-toolbar">
            <span class="drag-handle" draggable="true" title="按住拖拽排序">⠿</span>
            <div class="size-select-wrap">
              <select class="size-select" onchange="changeSpan('${card.id}', this.value)" title="选择卡片尺寸">
                <option value="span-05x" ${card.span === 'span-05x' ? 'selected' : ''}>0.5x 迷你</option>
                <option value="span-075x" ${card.span === 'span-075x' ? 'selected' : ''}>0.75x 紧凑</option>
                <option value="span-1x1" ${card.span === 'span-1x1' ? 'selected' : ''}>1.0x 标准</option>
                <option value="span-15x" ${card.span === 'span-15x' ? 'selected' : ''}>1.5x 宽屏</option>
                <option value="span-2x1" ${card.span === 'span-2x1' ? 'selected' : ''}>2.0x 通栏</option>
                <option value="span-1x2" ${card.span === 'span-1x2' ? 'selected' : ''}>1x2 纵向</option>
                <option value="span-2x2" ${card.span === 'span-2x2' ? 'selected' : ''}>2x2 大方</option>
              </select>
              <span class="size-select-arrow">▾</span>
            </div>
            <button class="tool-btn-icon" onclick="toggleDark('${card.id}')" title="切换暗黑风格">🎨</button>
            <button class="tool-btn-icon del-btn" onclick="removeCard('${card.id}')" title="删除此卡片">✕</button>
          </div>
        </div>
      `;
    }).join('');

    // Attach Drag Handle Listeners Only
    document.querySelectorAll('.drag-handle').forEach(handle => {
      handle.addEventListener('dragstart', handleDragStart);
      handle.addEventListener('dragend', handleDragEnd);
    });

    document.querySelectorAll('.bento-card').forEach(cardEl => {
      cardEl.addEventListener('dragover', handleDragOver);
      cardEl.addEventListener('dragleave', handleDragLeave);
      cardEl.addEventListener('drop', handleDrop);
    });
  }

  function addCard(type, defaultSpan = 'span-1x1') {
    const id = 'c' + Date.now();
    if (type === 'metric') {
      cards.push({ id, type, span: defaultSpan, kicker: 'METRIC', title: '指标', number: '99%', body: '描述' });
    } else if (type === 'graphic') {
      cards.push({ id, type, span: defaultSpan, kicker: 'GRAPHIC', title: '新功能演示', body: '上传原型截图：', imageUrl: '' });
    } else if (type === 'code') {
      cards.push({ id, type, span: defaultSpan, dark: true, kicker: 'CODE SPEC', title: '协议规范', body: '数据描述：', code: '{\n  "status": "ok"\n}' });
    } else if (type === 'diff') {
      cards.push({ id, type, span: defaultSpan, kicker: 'COMPARISON', title: '规则对比', body: '说明：', oldText: '❌ 旧逻辑说明', newText: '✅ 新逻辑说明' });
    } else if (type === 'notice') {
      cards.push({ id, type, span: defaultSpan, kicker: 'ALERT', title: '限制与提示', body: '说明：', alert: '⚠️ 注意提示内容' });
    } else if (type === 'link') {
      cards.push({ id, type, span: defaultSpan, kicker: 'LINK', title: '资源链接', body: '跳转原型：', linkTitle: '打开产品在线原型', linkUrl: '#' });
    } else if (type === 'member') {
      cards.push({ id, type, span: defaultSpan, kicker: 'OWNER', title: '负责人', body: '干系人：', memberName: '李四', memberRole: 'IoT 平台研发' });
    } else if (type === 'timeline') {
      cards.push({ id, type, span: defaultSpan, kicker: 'TIMELINE', title: '时间线', body: '发布节点：' });
    } else {
      cards.push({ id, type: 'checklist', span: defaultSpan, kicker: 'CHECKLIST', title: '确认清单', body: '确认项：', items: ['步骤一确认', '步骤二确认'] });
    }
    renderGrid();
    showToast('已添加新卡片');
  }

  function exportJson() {
    const data = {
      title: document.getElementById('docTitle').innerText,
      subtitle: document.getElementById('docSubtitle').innerText,
      cards
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${data.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_')}_草稿.json`;
    a.click();
    showToast('已导出 JSON 草稿文件');
  }

  function handleFileImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.title) document.getElementById('docTitle').innerText = data.title;
        if (data.subtitle) document.getElementById('docSubtitle').innerText = data.subtitle;
        if (Array.isArray(data.cards)) cards = data.cards;
        renderGrid();
        showToast('草稿载入成功');
      } catch {
        alert('解析草稿 JSON 失败，请检查文件格式');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function exportStandaloneHtml() {
    const title = document.getElementById('docTitle').innerText;
    const htmlContent = document.documentElement.outerHTML
      .replace(/<header>[\s\S]*?<\/header>/, '<header style="padding: 16px 32px; background: var(--panel); border-bottom: 1px solid var(--border);"><h2 style="font-size:16px;">🍱 ' + title + '</h2></header>')
      .replace(/<div class="onboarding-banner"[\s\S]*?<\/div>/, '')
      .replace(/card-toolbar/g, 'card-toolbar-hidden')
      .replace(/contenteditable="true"/g, '')
      .replace(/<button class="img-actions"[\s\S]*?<\/button>/g, '');

    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_')}.html`;
    a.click();
    showToast('已导出独立 HTML 网页！');
  }

  renderGrid();
</script>

</body>
</html>
