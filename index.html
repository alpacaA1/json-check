<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Hub</title>
<style>
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    color: #1f201d;
    background: #f5f0e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #f5f0e8;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { cursor: pointer; border-radius: 9px; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid rgba(223, 106, 75, .28);
    outline-offset: 2px;
  }
  .ui-icon { display: block; flex: none; }

  /* App Layout Shell */
  .app-shell {
    display: flex;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #f5f0e8;
  }

  /* Sidebar */
  .sidebar {
    width: 248px;
    flex-shrink: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 28px 16px 20px;
    overflow-y: auto;
    background: #242421;
    color: rgba(255, 253, 249, .78);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 8px 24px;
  }
  .brand > b {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: #df6a4b;
    color: #30140d;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
  }
  .brand strong { display: block; color: #fffdf9; font-size: 18px; letter-spacing: -.012em; }
  .brand small { display: block; margin-top: 3px; color: rgba(255, 253, 249, .48); font-size: 10px; letter-spacing: .12em; }

  .command-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 42px;
    margin-bottom: 22px;
    padding: 0 11px;
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 10px;
    background: rgba(255, 255, 255, .06);
    color: rgba(255, 253, 249, .66);
    font-size: 12px;
    text-align: left;
    white-space: nowrap;
  }
  .command-trigger > span { display: flex; align-items: center; gap: 8px; }
  .command-trigger:hover { background: rgba(255, 255, 255, .1); color: #fffdf9; }
  .command-trigger kbd, .toolbar-search kbd, .palette-search kbd {
    padding: 3px 5px;
    border: 1px solid currentColor;
    border-radius: 5px;
    font-size: 10px;
    font-family: inherit;
    opacity: .72;
  }

  .nav-label {
    margin: 0 10px 8px;
    color: rgba(255, 253, 249, .34);
    font-size: 10px;
    font-weight: 720;
    letter-spacing: .12em;
    white-space: nowrap;
  }

  nav { display: grid; gap: 5px; }
  nav button {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    padding: 0 12px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: inherit;
    font-size: 14px;
    font-weight: 610;
    text-align: left;
    white-space: nowrap;
    transition: background .16s, color .16s;
  }
  nav button > span { display: flex; align-items: center; gap: 8px; }
  nav button:hover { background: rgba(255, 255, 255, .055); color: #fffdf9; }
  nav .nav-active { background: #30302c; color: #fffdf9; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04); }
  nav .nav-active:before {
    position: absolute; left: 5px; width: 5px; height: 5px; border-radius: 50%; background: #df6a4b; content: "";
  }
  nav em {
    min-width: 24px;
    padding: 3px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .08);
    color: rgba(255, 255, 255, .62);
    font-size: 11px;
    font-style: normal;
    text-align: center;
  }

  .side-shortcuts { display: grid; gap: 4px; margin-top: 14px; }
  .side-shortcuts button {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: rgba(255, 253, 249, .58);
    font-size: 12px;
    text-align: left;
    white-space: nowrap;
  }
  .side-shortcuts button:hover { background: rgba(255, 255, 255, .055); color: #fffdf9; }

  .side-foot {
    margin-top: auto;
    padding: 13px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .035);
    color: rgba(255, 253, 249, .65);
    font-size: 12px;
    line-height: 1.6;
    white-space: nowrap;
  }
  .side-foot > i {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 7px;
    border-radius: 50%;
    background: #65c98d;
    box-shadow: 0 0 0 4px rgba(101, 201, 141, .1);
  }
  .side-foot small { color: rgba(255, 253, 249, .42); }

  /* Workspace Main Area */
  .workspace {
    flex: 1;
    min-width: 0;
    height: 100vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: #f5f0e8;
  }

  .app-toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    padding: 0 28px;
    border-bottom: 1px solid rgba(117, 102, 85, .12);
    background: rgba(245, 240, 232, .95);
    backdrop-filter: blur(16px);
    color: #4d4d47;
  }
  .toolbar-title { display: flex; align-items: center; gap: 10px; flex-shrink: 0; white-space: nowrap; }
  .toolbar-title strong { color: #1f201d; font-size: 15px; }
  .toolbar-title > span:last-of-type { color: #67645c; font-size: 12px; }
  .toolbar-folder { display: grid; place-items: center; width: 26px; height: 26px; color: #9f3f2a; }
  .toolbar-divider { color: #b8aea1; }
  .toolbar-more { min-height: 28px; padding: 0 5px; border: 0; background: transparent; color: #8b8175; }

  .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap; }
  .sync-state { display: flex; align-items: center; color: #67645c; font-size: 11px; margin-right: 4px; }
  .sync-state i {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: #65c98d;
  }

  .toolbar-search, .update-button, .icon-button {
    min-height: 34px;
    border: 1px solid #ded6cb;
    background: rgba(255, 253, 249, .68);
    color: #4d4d47;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .toolbar-search { padding: 0 10px; }
  .toolbar-search:hover, .update-button:hover, .icon-button:hover { background: #fffdf9; border-color: #cfc3b4; }
  .icon-button { display: grid; place-items: center; width: 34px; padding: 0; }

  button {
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid #ded6cb;
    border-radius: 9px;
    background: #fffdf9;
    color: #34342f;
    font-size: 11px;
    font-weight: 680;
    transition: transform .12s, background .16s, border-color .16s;
  }
  button:hover { border-color: #c8b9aa; }
  button:active { transform: scale(.97); }
  button.accent { border-color: #df6a4b; background: #df6a4b; color: #30140d; }
  button.accent:hover { background: #e6785b; }

  .content { max-width: 1360px; margin: 0 auto; padding: 28px 28px 60px; }

  /* Bento Cards Grid Dashboard */
  .overview-bento {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }

  .overview-card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid rgba(126, 105, 83, .15);
    border-radius: 18px;
    background: #fffdf9;
    box-shadow: 0 1px 2px rgba(48, 38, 27, .07), 0 8px 22px rgba(48, 38, 27, .05);
    transition: transform .18s, box-shadow .18s;
  }
  .overview-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(48, 38, 27, .08), 0 16px 34px rgba(48, 38, 27, .08);
  }

  .tile-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 12px;
    margin: 0;
    white-space: nowrap;
  }
  .tile-title > span { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 720; }
  .tile-title small { color: #67645c; font-size: 11px; }

  .overview-common { min-height: 250px; }
  .overview-running { min-height: 250px; background: #242421; color: #fffdf9; }
  .overview-running .tile-title small { color: rgba(255, 253, 249, .52); }
  .overview-running .tile-title > span i {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #65c98d;
    box-shadow: 0 0 0 4px rgba(101, 201, 141, .12);
  }
  .overview-running .compact-list .tool-row { background: rgba(255, 255, 255, .05); color: #fffdf9; }
  .overview-running .compact-list .tool-row:hover { border-color: rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .08); }
  .overview-running .compact-list .tool-copy strong { color: #fffdf9; }
  .overview-running .compact-list .tool-copy small { color: rgba(255, 253, 249, .48); }
  .overview-running .compact-list .row-open { color: #e89a82; }

  .overview-attention { min-height: 200px; background: #f8f3eb; }
  .overview-workspace { min-height: 200px; padding: 20px; background: #f2d6c9; }

  .empty-mini {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 32px 20px;
    color: #81776a;
    font-size: 12px;
  }
  .overview-running .empty-mini { color: rgba(255, 253, 249, .55); }

  .workspace-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .workspace-card-head span { display: block; color: #7f4939; font-size: 13px; font-weight: 760; }
  .workspace-card-head small { display: block; color: #896154; font-size: 11px; margin-top: 2px; }
  .workspace-card-head strong { color: #3a241c; font-size: 44px; letter-spacing: -.06em; line-height: 1; }

  .category-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 20px;
  }
  .category-stats button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 36px;
    padding: 0 10px;
    border-color: rgba(128, 87, 71, .18);
    border-radius: 8px;
    background: rgba(255, 253, 249, .45);
    color: #725348;
    font-size: 11px;
    white-space: nowrap;
  }
  .category-stats button:hover, .category-stats button.active {
    background: #fffaf7;
    border-color: rgba(128, 87, 71, .35);
  }
  .category-stats b { color: #9f3f2a; font-size: 12px; }

  /* Collection Heading & Tool Cards List */
  .collection-head, .list-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 32px 0 16px;
  }
  .collection-head span, .list-heading h1 { margin: 0; color: #1f201d; font-size: 24px; font-weight: 800; letter-spacing: -.025em; }
  .collection-head small { color: #67645c; font-size: 13px; margin-top: 3px; display: block; }
  .list-heading span { color: #9f3f2a; font-size: 11px; font-weight: 720; letter-spacing: .1em; }
  .filter-count { background: rgba(255, 253, 249, .68); color: #4d4d47; display: inline-flex; align-items: center; gap: 7px; }

  .tool-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  .tool-row {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 220px;
    padding: 20px;
    border: 1px solid rgba(126, 105, 83, .15);
    border-radius: 18px;
    background: #fffdf9;
    box-shadow: 0 1px 2px rgba(48, 38, 27, .07), 0 8px 22px rgba(48, 38, 27, .05);
    transition: transform .18s, box-shadow .18s;
  }
  .tool-row:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(48, 38, 27, .08), 0 16px 34px rgba(48, 38, 27, .08);
  }

  .tool-row-header {
    display: grid;
    grid-template-columns: 42px 1fr 28px;
    gap: 12px;
    align-items: flex-start;
  }

  .item-mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #242421;
    color: #fffdf9;
    font-size: 11px;
    font-weight: 780;
  }
  .mark-tool { background: #df6a4b; color: #30140d; }
  .mark-project { background: #e7e7d8; color: #4b5235; }
  .mark-prototype { background: #dce9e8; color: #396869; }
  .mark-resource { background: #e7e2ef; color: #635177; }

  .tool-copy { min-width: 0; }
  .tool-copy strong {
    display: block;
    overflow: hidden;
    color: #1f201d;
    font-size: 17px;
    letter-spacing: -.015em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tool-copy small {
    display: block;
    margin-top: 4px;
    overflow: hidden;
    color: #67645c;
    font-size: 12px;
    line-height: 1.45;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 16px 0 14px;
  }
  .row-tags span {
    padding: 4px 8px;
    border-radius: 6px;
    background: #f8f3eb;
    color: #67645c;
    font-size: 10px;
    font-weight: 650;
  }

  .tool-row-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
  }

  .row-state {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(31, 32, 29, .065);
    color: #6b6962;
    font-size: 11px;
    font-weight: 680;
  }
  .row-state:before {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: currentColor;
    content: "";
  }
  .row-state.is-running, .row-state.is-online { background: #e3f1e8; color: #2f8f5b; }
  .row-state.is-service { background: #e8eef6; color: #35628c; }
  .row-state.is-local { background: #f2ede4; color: #787267; }

  .star {
    min-height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #a59b8e;
    display: grid;
    place-items: center;
  }
  .star.is-favorite { color: #d49538; }
  .star.is-favorite .ui-icon { fill: currentColor; }

  .tool-actions-group {
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .more-actions {
    min-height: 32px;
    padding: 0 4px;
    border: 0;
    background: transparent;
    color: #91877b;
    display: grid;
    place-items: center;
  }

  .action-menu {
    position: absolute;
    z-index: 12;
    right: 0;
    bottom: 38px;
    display: grid;
    min-width: 150px;
    padding: 5px;
    border: 1px solid #ded6cb;
    border-radius: 9px;
    background: #fffdf9;
    box-shadow: 0 10px 26px rgba(36, 33, 28, .16);
  }
  .action-menu button {
    min-height: 29px;
    padding: 0 8px;
    border: 0;
    background: transparent;
    text-align: left;
    font-size: 11px;
  }
  .action-menu button:hover { background: #f8f3eb; }

  .row-open {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 32px;
    padding: 0 12px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 680;
  }

  /* Compact List inside Bento Cards */
  .compact-list { display: grid; gap: 6px; padding: 0 12px 14px; }
  .compact-list .tool-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    min-height: 52px;
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: rgba(255, 253, 249, .66);
    box-shadow: none;
  }
  .compact-list .tool-row:hover {
    border-color: #ded6cb;
    background: #fffdf9;
  }
  .compact-list .compact-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .compact-list .item-mark { width: 34px; height: 34px; border-radius: 9px; font-size: 9px; flex-shrink: 0; }
  .compact-list .tool-copy strong { font-size: 12px; }
  .compact-list .tool-copy small { margin-top: 2px; font-size: 10px; }
  .compact-list .compact-open-btn {
    min-height: 28px;
    padding: 0 8px;
    border: 0;
    background: transparent;
    color: #9f3f2a;
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }

  /* Modal Command Palette (⌘ K) */
  .modal-backdrop {
    position: fixed;
    z-index: 50;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 22px;
    background: rgba(36, 36, 33, .38);
  }
  .palette-backdrop {
    align-items: start;
    padding-top: 12vh;
    backdrop-filter: blur(4px);
  }
  .command-palette {
    width: min(640px, 100%);
    overflow: hidden;
    border: 1px solid #ded6cb;
    border-radius: 18px;
    background: #fffdf9;
    box-shadow: 0 22px 70px rgba(32, 29, 25, .28);
  }
  .palette-search {
    display: grid;
    grid-template-columns: 25px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 15px 18px;
    border-bottom: 1px solid #e4ddd3;
    color: #9f3f2a;
  }
  .palette-search input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #1f201d;
    font-size: 16px;
  }
  .palette-caption {
    display: flex;
    justify-content: space-between;
    padding: 11px 18px 7px;
    color: #82786c;
    font-size: 11px;
  }
  .palette-results {
    display: grid;
    max-height: 380px;
    overflow-y: auto;
    padding: 0 11px 11px;
  }
  .palette-results > a {
    display: grid;
    grid-template-columns: 32px 1fr 22px;
    gap: 10px;
    align-items: center;
    min-height: 52px;
    padding: 8px 10px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    text-align: left;
    text-decoration: none;
    color: inherit;
  }
  .palette-results > a:hover, .palette-results > a.palette-active {
    background: #f8f3eb;
  }
  .palette-results .item-mark { width: 30px; height: 30px; border-radius: 9px; font-size: 8px; }
  .palette-results strong { display: block; font-size: 13px; color: #1f201d; }
  .palette-results small { display: block; margin-top: 2px; color: #67645c; font-size: 10px; }

  /* Toast Notification */
  .toast {
    position: fixed;
    z-index: 60;
    right: 20px;
    bottom: 20px;
    max-width: 420px;
    border: 0;
    background: #242421;
    color: #fffdf9;
    box-shadow: 0 12px 28px rgba(36, 36, 33, .24);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 12px;
  }

  /* Responsive Adjustments */
  @media (max-width: 1120px) {
    .overview-bento { grid-template-columns: 1fr; }
    .tool-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 840px) {
    .sidebar { width: 78px; padding: 28px 8px 18px; }
    .brand { justify-content: center; }
    .brand span, .command-trigger span, .command-trigger kbd, .nav-label, nav button span, .side-shortcuts, .side-foot { display: none; }
    .command-trigger { justify-content: center; }
    nav button { justify-content: center; }
    .tool-list { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <b><span id="icon-brand"></span></b>
      <span>
        <strong>Tool Hub</strong>
        <small>LOCAL LAUNCHER</small>
      </span>
    </div>

    <button class="command-trigger" id="commandTrigger">
      <span><span id="icon-search-btn"></span>搜索或输入命令</span>
      <kbd>⌘ K</kbd>
    </button>

    <p class="nav-label">工作区</p>
    <nav id="sidebarNav"></nav>

    <p class="nav-label">快捷入口</p>
    <div class="side-shortcuts">
      <button onclick="openPalette()"><span id="icon-plus-1"></span>新建可扫描项目</button>
      <button onclick="openPalette()"><span id="icon-upload-1"></span>收录已有项目</button>
      <button onclick="openPalette()"><span id="icon-cmd-1"></span>打开命令面板</button>
    </div>

    <div class="side-foot">
      <i></i> 云端就绪<br/>
      <small>7 个入口 · 7 个运行中</small>
    </div>
  </aside>

  <!-- Main Workspace -->
  <section class="workspace">
    <header class="app-toolbar">
      <div class="toolbar-title">
        <span class="toolbar-folder"><span id="icon-folder-head"></span></span>
        <strong>工作台</strong>
        <span class="toolbar-divider">/</span>
        <span id="subTitleText">今日概览</span>
        <button class="toolbar-more" aria-label="更多工作区操作" onclick="showToast('已与云端完成同步')">
          <span id="icon-more-head"></span>

      <div class="toolbar-actions">
        <span class="sync-state"><i></i> 云端已同步</span>
        <button class="update-button" onclick="showToast('当前已是最新版本 (v2.0.0)')">
          <span id="icon-upload-head"></span> 检查更新
        </button>
        <button class="toolbar-search" id="toolbarSearch">
          <span id="icon-search-head"></span> 搜索 <kbd>⌘ K</kbd>

        <button class="icon-button" aria-label="刷新入口状态" onclick="location.reload()">

        <button class="accent toolbar-new" onclick="openPalette()">

    <div class="content">
      <!-- Overview Home View -->
      <div id="homeView">
        <section class="overview-bento">
          <article class="overview-card overview-common">

              <span>常用入口</span>
              <small>固定优先 · 最近补位</small>

          </article>

          <article class="overview-card overview-running">
            <div class="tile-title">
              <span><i></i>正在运行</span>
              <small>7 个静态服务</small>
            </div>
            <div class="compact-list" id="runningList"></div>
          </article>

          <article class="overview-card overview-attention">
            <div class="tile-title">
              <span>待处理</span>
              <small>一切就绪</small>
            </div>
            <div class="empty-mini">
              <span id="icon-grid-att"></span> 没有路径失效或待确认的入口。
            </div>
          </article>

          <article class="overview-card overview-workspace">
            <div class="workspace-card-head">
              <div>
                <span>工作区</span>
                <small>已收录入口</small>
              </div>
              <strong>7</strong>
            </div>
            <div class="category-stats" id="catStats"></div>
          </article>
        </section>

        <section class="collection-head">
          <div>
            <span>所有入口</span>
            <small>工具、项目和原型都能从这里直接打开</small>
          </div>
          <button class="filter-count" onclick="openPalette()">
            <span id="icon-search-coll"></span> 搜索全部
          </button>
        </section>

        <div class="tool-list" id="homeToolList"></div>
      </div>

      <!-- Category Specific View -->
      <div id="sectionView" style="display: none;">
        <section class="list-heading">
          <div>
            <span id="secKicker">工具库</span>
            <h1 id="secHeading">2 个可用入口</h1>
          </div>
          <button class="filter-count" onclick="openPalette()">
            <span id="icon-search-sec"></span> 搜索
          </button>
        </section>
        <div class="tool-list" id="sectionToolList"></div>
      </div>

    </div>
  </section>
</div>

<!-- Command Palette Modal (⌘ K) -->
<div class="modal-backdrop palette-backdrop" id="paletteModal" style="display: none;" onclick="closePalette()">
  <section class="command-palette" onclick="event.stopPropagation()">
    <div class="palette-search">
      <span id="icon-palette-search"></span>
      <input type="text" id="paletteInput" placeholder="搜索工具、项目、标签…" />
      <kbd>ESC</kbd>
    </div>
    <div class="palette-caption">
      <span>最近使用与全部入口</span>
      <small>↑↓ 选择　↵ 打开</small>
    </div>
    <div class="palette-results" id="paletteResults"></div>
  </section>
</div>

<!-- Toast -->
<button class="toast" id="toastNotice" style="display: none;" onclick="this.style.display='none'"></button>

<script>
  function renderIconSvg(name, size = 18) {
    const paths = {
      grid: '<rect x="4" y="4" width="6" height="6" rx="1.4" fill="currentColor" stroke="none"/><rect x="14" y="4" width="6" height="6" rx="1.4" fill="currentColor" stroke="none"/><rect x="4" y="14" width="6" height="6" rx="1.4" fill="currentColor" stroke="none"/><rect x="14" y="14" width="6" height="6" rx="1.4" fill="currentColor" stroke="none"/>',
      search: '<circle cx="10.8" cy="10.8" r="5.5"/><path d="m15.1 15.1 4.1 4.1"/>',
      refresh: '<path d="M20 11a8 8 0 1 0 2.1 5.4"/><path d="M20 4v7h-7"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      folder: '<path d="M3.8 7.8c0-1.1.9-2 2-2h4l1.7 2H18c1.2 0 2 .8 2 2v7.4c0 1.1-.8 2-2 2H5.8c-1.1 0-2-.9-2-2Z"/>',
      wrench: '<path d="M14.7 5.1a4.4 4.4 0 0 0-5.5 5.5L4.4 15.4a2.1 2.1 0 1 0 3 3l4.8-4.8a4.4 4.4 0 0 0 5.5-5.5l-3.1 3.1-2.5-2.5Z"/>',
      panels: '<rect x="3.7" y="4.4" width="16.6" height="15.2" rx="2"/><path d="M9.1 4.7v14.6M9.1 10.1h10.7"/>',
      book: '<path d="M4.5 5.6A2.6 2.6 0 0 1 7.1 3H19.5v16H7.1a2.6 2.6 0 0 0-2.6 2.6Z"/><path d="M4.5 5.6v16"/>',
      command: '<path d="M9.3 8.1V6.5a2.7 2.7 0 1 0-2.7 2.7h10.8a2.7 2.7 0 1 1-2.7 2.7v-1.6"/><path d="M14.7 15.9v1.6a2.7 2.7 0 1 0 2.7-2.7H6.6a2.7 2.7 0 1 1 2.7-2.7v1.6"/>',
      star: '<path d="m12 3.7 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.8Z"/>',
      more: '<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>',
      arrow: '<path d="M5 12h13"/><path d="m13 6 6 6-6 6"/>',
      upload: '<path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 14v4.4c0 .9.7 1.6 1.6 1.6h10.8c.9 0 1.6-.7 1.6-1.6V14"/>',
      layout: '<rect x="3.8" y="4" width="16.4" height="16" rx="2"/><path d="M3.8 10h16.4M10 10v10"/>'
    };
    return `<svg class="ui-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || ''}</svg>`;
  }

  // Set static icon slots
  document.getElementById('icon-brand').innerHTML = renderIconSvg('grid', 24);
  document.getElementById('icon-search-btn').innerHTML = renderIconSvg('search', 15);
  document.getElementById('icon-plus-1').innerHTML = renderIconSvg('plus', 15);
  document.getElementById('icon-upload-1').innerHTML = renderIconSvg('upload', 15);
  document.getElementById('icon-cmd-1').innerHTML = renderIconSvg('command', 15);
  document.getElementById('icon-folder-head').innerHTML = renderIconSvg('folder', 19);
  document.getElementById('icon-more-head').innerHTML = renderIconSvg('more', 18);
  document.getElementById('icon-upload-head').innerHTML = renderIconSvg('upload', 14);
  document.getElementById('icon-search-head').innerHTML = renderIconSvg('search', 14);
  document.getElementById('icon-refresh-head').innerHTML = renderIconSvg('refresh', 17);
  document.getElementById('icon-plus-head').innerHTML = renderIconSvg('plus', 16);
  document.getElementById('icon-grid-att').innerHTML = renderIconSvg('grid', 17);
  document.getElementById('icon-search-coll').innerHTML = renderIconSvg('search', 14);
  document.getElementById('icon-search-sec').innerHTML = renderIconSvg('search', 14);
  document.getElementById('icon-palette-search').innerHTML = renderIconSvg('search', 19);

  // Items database & dynamic loading
  let items = [];

  function resolveItem(raw) {
    const category = raw.category || 'tool';
    const tags = raw.tags || [];
    let targetType = 'local_folder';
    let targetUrl = '';
    let badge = '本地资源';
    let badgeClass = 'is-local';

    if (raw.url && /^https:\/\//i.test(raw.url)) {
      targetType = 'online';
      targetUrl = raw.url;
      badge = '在线服务';
      badgeClass = 'is-online';
    } else if (raw.id === 'json-check') {
      targetType = 'static';
      targetUrl = 'prototypes/json-check.html';
      badge = '在线工具';
      badgeClass = 'is-running';
    } else if (raw.id === 'bento-doc-builder') {
      targetType = 'static';
      targetUrl = 'prototypes/bento-doc-builder.html';
      badge = '在线生成器';
      badgeClass = 'is-running';
    } else if (raw.id === 'kira-omega') {
      targetType = 'static';
      targetUrl = 'prototypes/kira-omega.html';
      badge = '静态单页';
      badgeClass = 'is-running';
    } else if (raw.id === 'calibration-training') {
      targetType = 'static';
      targetUrl = 'prototypes/calibration-training.html';
      badge = '培训单页';
      badgeClass = 'is-running';
    } else if (raw.id === 'data-refresh') {
      targetType = 'static';
      targetUrl = 'prototypes/data-refresh/index.html';
      badge = '静态原型';
      badgeClass = 'is-running';
    } else if (raw.id === 'iot-3d-demo') {
      targetType = 'static';
      targetUrl = 'prototypes/iot-3d-demo/index.html';
      badge = '3D 交互';
      badgeClass = 'is-running';
    } else if (raw.id === 'iot-attribute-frontend') {
      targetType = 'static';
      targetUrl = 'prototypes/iot-attribute-frontend.html';
      badge = '前端单页';
      badgeClass = 'is-running';
    } else if (raw.id === 'skills-manager') {
      targetType = 'static';
      targetUrl = 'prototypes/skills-manager.html';
      badge = '静态原型';
      badgeClass = 'is-running';
    } else if (raw.mode === 'static' && raw.root && raw.root.includes('{hubRoot}/managed')) {
      targetType = 'static';
      targetUrl = 'managed/' + (raw.entry || (raw.id + '.html'));
      badge = '静态单页';
      badgeClass = 'is-running';
    } else if (raw.mode === 'service') {
      targetType = 'local_service';
      targetUrl = raw.url || (raw.port ? `http://127.0.0.1:${raw.port}` : '');
      badge = raw.port ? `本地端口 :${raw.port}` : '本地服务';
      badgeClass = 'is-service';
    } else {
      targetType = 'local_folder';
      targetUrl = '';
      badge = raw.category === 'resource' ? '本地资料' : '本地目录';
      badgeClass = 'is-local';
    }

    return {
      id: raw.id,
      name: raw.name,
      description: raw.description || '',
      category: category,
      tags: tags,
      root: raw.root || '',
      port: raw.port,
      targetType: targetType,
      targetUrl: targetUrl,
      badge: badge,
      badgeClass: badgeClass,
      raw: raw
    };
  }

  const FALLBACK_RAW_ITEMS = [
    { id: 'json-check', name: 'JSON Check', description: 'JSON 格式化、校验与修复', category: 'tool', mode: 'static', entry: 'json-check.html', tags: ['JSON', '调试', '格式化'] },
    { id: 'bento-doc-builder', name: 'Bento Doc Builder', description: '视觉 PRD & 培训文档便当盒页面生成器', category: 'tool', mode: 'static', entry: 'bento-doc-builder.html', tags: ['Bento', 'PRD', '生成器'] },
    { id: 'chagee-refund', name: '霸王茶姬退款查询', description: '霸王茶姬退款日志与订单查询平台', category: 'tool', mode: 'service', url: 'https://chagee-refund.2d.ltd/', tags: ['霸王茶姬', '退款', '查询'] },
    { id: 'skills-manager', name: 'Skills Manager', description: '管理本地 Agent Skills', category: 'tool', mode: 'service', port: 3456, url: 'http://127.0.0.1:3456', tags: ['Skills', 'Agent', '管理'] },
    { id: 'new-iot-console', name: 'New IoT Console', description: 'IoT 管理后台与物模型配置', category: 'project', mode: 'service', port: 5173, tags: ['IoT', 'React', 'Vite'] },
    { id: 'iot-attribute-frontend', name: 'IoT Attribute Frontend', description: '茶饮机设备属性轻量前端', category: 'prototype', mode: 'static', tags: ['IoT', '属性', '原型'] },
    { id: 'kira-omega', name: 'KIRA OMEGA IoT', description: 'IoT 专业透视控制中心', category: 'prototype', mode: 'static', tags: ['IoT', '控制台', '单页'] },
    { id: 'calibration-training', name: '自动校准功能培训', description: '自动校准培训与演示材料', category: 'prototype', mode: 'static', tags: ['校准', '培训', '演示'] },
    { id: 'data-refresh', name: '数据刷新', description: '设备数据刷新页面复刻', category: 'prototype', mode: 'static', tags: ['数据刷新', '静态原型'] },
    { id: 'iot-3d-demo', name: 'IoT 3D 热区测试', description: '设备 3D 模块与热区交互', category: 'prototype', mode: 'static', tags: ['3D', 'IoT', '热区'] }
  ];

  function readIds(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
  }
  function saveIds(key, ids) {
    localStorage.setItem(key, JSON.stringify(ids));
  }

  let favorites = readIds('tool-hub-favorites');
  if (!favorites.length) favorites = ['json-check', 'skills-manager'];
  let recent = readIds('tool-hub-recent');

  let activeSection = 'home';
  let paletteIndex = 0;
  let activeActionId = null;

  function showToast(msg) {
    const t = document.getElementById('toastNotice');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3500);
  }

  function handleOpenItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;

    recent = [id, ...recent.filter(i => i !== id)].slice(0, 5);
    saveIds('tool-hub-recent', recent);

    if (item.targetType === 'online' || item.targetType === 'static') {
      window.open(item.targetUrl, '_blank', 'noopener,noreferrer');
      return;
    }

    if (item.targetType === 'local_service') {
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        window.open(item.targetUrl, '_blank', 'noopener,noreferrer');
      } else {
        showToast(`💻 本地服务（${item.badge}）：需在运行了 Tool Hub 本地客户端的机器上访问`);
      }
      return;
    }

    // local_folder
    showToast(`📂 本地资源：${item.root || item.name}（请在本地桌面应用中直接打开）`);
  }

  function copyItemUrl(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const fullUrl = item.targetUrl ? (/^https?:\/\//i.test(item.targetUrl) ? item.targetUrl : (location.origin + '/' + item.targetUrl.replace(/^\/+/, ''))) : (item.root || item.name);
    navigator.clipboard.writeText(fullUrl).then(() => {
      showToast('已复制地址/路径信息');
    }).catch(() => {
      showToast('复制失败');
    });
    activeActionId = null;
    renderViews();
  }

  function toggleFavorite(id) {
    if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
    else favorites = [id, ...favorites];
    saveIds('tool-hub-favorites', favorites);
    renderViews();
  }

  function toggleActionMenu(id, e) {
    e.stopPropagation();
    activeActionId = activeActionId === id ? null : id;
    renderViews();
  }

  document.addEventListener('click', () => {
    if (activeActionId) { activeActionId = null; renderViews(); }
  });

  function renderToolRowHtml(item, compact = false) {
    const isFav = favorites.includes(item.id);
    const markText = item.name.slice(0, 2);
    const starSvg = `<svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.7 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.8Z"/></svg>`;

    if (compact) {
      return `
        <div class="tool-row">
          <div class="compact-left">
            <span class="item-mark mark-${item.category}">${markText}</span>
            <div class="tool-copy">
              <strong>${item.name}</strong>
              <small>${item.category}</small>
            </div>
          </div>
          <button class="compact-open-btn" onclick="handleOpenItem('${item.id}')">
            ${renderIconSvg('arrow', 16)}
          </button>
        </div>
      `;
    }

    const showMenu = activeActionId === item.id;
    const isDirectOpen = item.targetType === 'online' || item.targetType === 'static';

    return `
      <div class="tool-row">
        <div>
          <div class="tool-row-header">
            <span class="item-mark mark-${item.category}">${markText}</span>
            <div class="tool-copy">
              <strong>${item.name}</strong>
              <small>${item.description}</small>
            </div>
            <button class="star ${isFav ? 'is-favorite' : ''}" aria-label="收藏 ${item.name}" onclick="toggleFavorite('${item.id}')">
              ${starSvg}
            </button>
          </div>
          <div class="row-tags">
            ${item.tags.slice(0, 3).map(tag => `<span>${tag}</span>`).join('')}
          </div>
        </div>

        <div class="tool-row-footer">
          <span class="row-state ${item.badgeClass}">${item.badge}</span>
          <div class="tool-actions-group">
            <button class="more-actions" aria-label="更多操作" onclick="toggleActionMenu('${item.id}', event)">
              ${renderIconSvg('more', 18)}
            </button>
            ${showMenu ? `
              <div class="action-menu" onclick="event.stopPropagation()">
                <button onclick="handleOpenItem('${item.id}')">${isDirectOpen ? '在新标签打开' : '查看运行信息'}</button>
                <button onclick="copyItemUrl('${item.id}')">复制链接/路径</button>
              </div>
            ` : ''}
            <button class="row-open ${isDirectOpen ? 'accent' : ''}" onclick="handleOpenItem('${item.id}')">
              ${isDirectOpen ? '打开' : (item.targetType === 'local_service' ? '本地服务' : '查看')}
              ${renderIconSvg(isDirectOpen ? 'arrow' : 'command', 15)}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function renderSidebarNav() {
    const sections = [
      ['home', '概览', 'layout'],
      ['tool', '工具', 'wrench'],
      ['project', '项目', 'folder'],
      ['prototype', '原型', 'panels'],
      ['resource', '资料', 'book']
    ];

    document.getElementById('sidebarNav').innerHTML = sections.map(([id, label, iconName]) => {
      const count = id === 'home' ? '' : items.filter(i => i.category === id).length || '0';
      const active = activeSection === id ? 'nav-active' : '';
      return `
        <button class="${active}" data-sec="${id}">
          <span>${renderIconSvg(iconName, 17)} ${label}</span>
          ${id !== 'home' ? `<em>${count}</em>` : ''}
        </button>
      `;
    }).join('');
  }

  function renderCategoryStats() {
    const stats = [
      ['tool', '工具'],
      ['project', '项目'],
      ['prototype', '原型'],
      ['resource', '资料']
    ];

    document.getElementById('catStats').innerHTML = stats.map(([id, label]) => {
      const count = items.filter(i => i.category === id).length;
      return `
        <button data-sec="${id}">
          <span>${label}</span>
          <b>${count}</b>
        </button>
      `;
    }).join('');
  }

  function renderViews() {
    renderSidebarNav();
    renderCategoryStats();

    const homeView = document.getElementById('homeView');
    const sectionView = document.getElementById('sectionView');
    const subTitleText = document.getElementById('subTitleText');

    const favItems = favorites.map(id => items.find(i => i.id === id)).filter(Boolean);
    const recentItems = recent.map(id => items.find(i => i.id === id)).filter(Boolean);
    const frequentItems = [...favItems, ...recentItems.filter(i => !favorites.includes(i.id))].slice(0, 5);

    if (activeSection === 'home') {
      homeView.style.display = 'block';
      sectionView.style.display = 'none';
      subTitleText.innerText = '今日概览';

      if (frequentItems.length) {
        document.getElementById('commonList').innerHTML = frequentItems.map(item => renderToolRowHtml(item, true)).join('');
      } else {
        document.getElementById('commonList').innerHTML = `<div class="empty-mini">${renderIconSvg('star', 17)} 打开或收藏入口后，它们会出现在这里。</div>`;
      }

      document.getElementById('runningList').innerHTML = items.slice(0, 4).map(item => renderToolRowHtml(item, true)).join('');
      document.getElementById('homeToolList').innerHTML = items.map(item => renderToolRowHtml(item)).join('');
    } else {
      homeView.style.display = 'none';
      sectionView.style.display = 'block';

      const secNames = { tool: '工具', project: '项目', prototype: '原型', resource: '资料' };
      const secName = secNames[activeSection] || '库';
      subTitleText.innerText = secName + '库';
      document.getElementById('secKicker').innerText = secName + '库';

      const filtered = items.filter(item => item.category === activeSection);
      document.getElementById('secHeading').innerText = `${filtered.length} 个可用入口`;

      if (filtered.length === 0) {
        document.getElementById('sectionToolList').innerHTML = `<div class="empty-mini" style="grid-column: 1/-1; padding: 40px 0;">${renderIconSvg('grid', 17)} 该分类下暂无已收录的入口</div>`;
      } else {
        document.getElementById('sectionToolList').innerHTML = filtered.map(item => renderToolRowHtml(item)).join('');
      }
    }
  }

  // Event Listeners
  document.getElementById('sidebarNav').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    activeSection = btn.dataset.sec;
    renderViews();
  });

  document.getElementById('catStats').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    activeSection = btn.dataset.sec;
    renderViews();
  });

  // Palette Modal Handlers
  const paletteModal = document.getElementById('paletteModal');
  const paletteInput = document.getElementById('paletteInput');
  const paletteResults = document.getElementById('paletteResults');

  function openPalette() {
    paletteModal.style.display = 'grid';
    paletteInput.value = '';
    paletteIndex = 0;
    paletteInput.focus();
    renderPaletteResults('');
  }

  function closePalette() {
    paletteModal.style.display = 'none';
  }

  function renderPaletteResults(query) {
    const filtered = items.filter(item => {
      const haystack = (item.name + ' ' + item.description + ' ' + item.tags.join(' ')).toLowerCase();
      return !query || haystack.includes(query.toLowerCase());
    });

    if (filtered.length === 0) {
      paletteResults.innerHTML = `<div style="padding: 16px; color: #82786c; font-size: 12px; text-align: center;">没有找到匹配的入口</div>`;
      return;
    }

    paletteResults.innerHTML = filtered.map((item, idx) => `
      <a href="javascript:void(0)" class="${idx === paletteIndex ? 'palette-active' : ''}" onclick="handleOpenItem('${item.id}')">
        <span class="item-mark mark-${item.category}">${item.name.slice(0, 2)}</span>
        <span>
          <strong>${item.name}</strong>
          <small>${item.description}</small>
        </span>
        <span class="row-state ${item.badgeClass}" style="margin-left:auto; font-size:11px; padding:2px 6px;">${item.badge}</span>
      </a>
    `).join('');
  }

  document.getElementById('commandTrigger').addEventListener('click', openPalette);
  document.getElementById('toolbarSearch').addEventListener('click', openPalette);

  paletteInput.addEventListener('input', e => {
    paletteIndex = 0;
    renderPaletteResults(e.target.value);
  });

  window.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openPalette();
    }
    if (e.key === 'Escape') {
      closePalette();
    }
    if (paletteModal.style.display !== 'none') {
      const filtered = items.filter(item => {
        const query = paletteInput.value;
        const haystack = (item.name + ' ' + item.description + ' ' + item.tags.join(' ')).toLowerCase();
        return !query || haystack.includes(query.toLowerCase());
      });
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        paletteIndex = Math.min(paletteIndex + 1, filtered.length - 1);
        renderPaletteResults(paletteInput.value);
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        paletteIndex = Math.max(paletteIndex - 1, 0);
        renderPaletteResults(paletteInput.value);
      }
      if (e.key === 'Enter' && filtered[paletteIndex]) {
        e.preventDefault();
        handleOpenItem(filtered[paletteIndex].id);
      }
    }
  });

  // Async load tools.json
  async function loadTools() {
    try {
      const res = await fetch('./tools.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (Array.isArray(data.items)) {
        items = data.items.map(resolveItem);
      } else {
        items = FALLBACK_RAW_ITEMS.map(resolveItem);
      }
    } catch (e) {
      console.warn('Load tools.json failed, using fallback items:', e);
      items = FALLBACK_RAW_ITEMS.map(resolveItem);
    }
    renderViews();
  }

  loadTools();
</script>
</body>
</html>
