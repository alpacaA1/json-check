<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Hub · 云端工具与原型控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0f19;
    --bg-card: rgba(22, 30, 46, 0.7);
    --bg-card-hover: rgba(30, 41, 64, 0.85);
    --border-card: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(99, 102, 241, 0.4);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-indigo: #6366f1;
    --accent-purple: #a855f7;
    --accent-cyan: #06b6d4;
    --accent-emerald: #10b981;
    --accent-amber: #f59e0b;
    --glow-indigo: rgba(99, 102, 241, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 24px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1160px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-card);
    flex-wrap: wrap;
    gap: 20px;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
  }

  .brand-icon svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2.2; }

  .brand-title h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-title p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .header-badge {
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: var(--accent-emerald);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .dot-ping {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-emerald);
    box-shadow: 0 0 8px var(--accent-emerald);
  }

  /* Controls Section */
  .controls {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 280px;
    max-width: 480px;
  }

  .search-box input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 12px;
    padding: 12px 16px 12px 44px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }

  .search-box input:focus {
    border-color: var(--accent-indigo);
    box-shadow: 0 0 0 4px var(--glow-indigo);
  }

  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    stroke: var(--text-muted);
  }

  .category-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    color: var(--text-secondary);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .pill:hover, .pill.active {
    background: var(--accent-indigo);
    border-color: var(--accent-indigo);
    color: #fff;
    box-shadow: 0 4px 12px var(--glow-indigo);
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--card-accent, var(--accent-indigo)), var(--accent-purple));
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    background: var(--bg-card-hover);
  }

  .card:hover::before { opacity: 1; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 14px;
  }

  .card-avatar {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--card-accent, var(--accent-indigo));
    flex-shrink: 0;
  }

  .card-meta h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .card-meta .tag-list {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-secondary);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 20px;
    flex-grow: 1;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 13px;
    font-weight: 600;
    color: var(--card-accent, var(--accent-indigo));
  }

  .card-footer svg {
    width: 16px; height: 16px;
    stroke: currentColor;
    transition: transform 0.2s ease;
  }

  .card:hover .card-footer svg {
    transform: translateX(4px);
  }

  /* Empty state */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-group">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="brand-title">
          <h1>Tool Hub · 静态原型库</h1>
          <p>云端单页工具、产品原型与交互测试集中管理</p>
        </div>
      </div>
      <div class="header-badge">
        <span class="dot-ping"></span> GitHub Pages 云端服务运行中
      </div>
    </header>

    <div class="controls">
      <div class="search-box">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" placeholder="搜索原型名称、关键词或标签...">
      </div>
      <div class="category-pills" id="categoryPills">
        <button class="pill active" data-cat="all">全部原型 (7)</button>
        <button class="pill" data-cat="tool">单页工具</button>
        <button class="pill" data-cat="prototype">交互原型</button>
        <button class="pill" data-cat="iot">IoT 控制台</button>
      </div>
    </div>

    <div class="grid" id="toolsGrid">
      <!-- Cards rendered via JavaScript -->
    </div>

    <footer>
      Tool Hub Cloud Hub · 托管于 GitHub Pages · 随处即用
    </footer>
  </div>

<script>
  const items = [
    {
      id: 'json-check',
      name: 'JSON Check',
      desc: 'JSON 格式化、智能校验、实时修复与视图调试工具。',
      category: 'tool',
      tags: ['JSON', '调试', '格式化'],
      url: 'prototypes/json-check.html',
      accent: '#6366f1'
    },
    {
      id: 'skills-manager',
      name: 'Skills Manager',
      desc: 'Agent Skills 本地与云端资源管理控制台单页。',
      category: 'tool',
      tags: ['Skills', 'Agent', '管理'],
      url: 'prototypes/skills-manager.html',
      accent: '#06b6d4'
    },
    {
      id: 'iot-attribute',
      name: 'IoT 设备属性前端',
      desc: '茶饮机/设备属性状态轻量前端展示与交互原型。',
      category: 'iot',
      tags: ['IoT', '属性', '设备'],
      url: 'prototypes/iot-attribute-frontend.html',
      accent: '#10b981'
    },
    {
      id: 'kira-omega',
      name: 'KIRA OMEGA IoT',
      desc: 'IoT 专业透视控制中心与高阶可视化监控原型。',
      category: 'iot',
      tags: ['IoT', '控制台', '单页'],
      url: 'prototypes/kira-omega.html',
      accent: '#a855f7'
    },
    {
      id: 'calibration-training',
      name: '自动校准功能培训',
      desc: '设备自动校准流程培训、演示与 Bento 结构化说明。',
      category: 'prototype',
      tags: ['校准', '培训', '演示'],
      url: 'prototypes/calibration-training.html',
      accent: '#f59e0b'
    },
    {
      id: 'data-refresh',
      name: '数据刷新原型',
      desc: '设备数据刷新页面复刻与数据重载状态原型。',
      category: 'prototype',
      tags: ['数据刷新', '静态原型'],
      url: 'prototypes/data-refresh/index.html',
      accent: '#3b82f6'
    },
    {
      id: 'iot-3d-demo',
      name: 'IoT 3D 热区测试',
      desc: '设备 3D 结构模块渲染与热区感知交互测试。',
      category: 'prototype',
      tags: ['3D', 'IoT', '热区'],
      url: 'prototypes/iot-3d-demo/index.html',
      accent: '#ec4899'
    }
  ];

  let activeCat = 'all';
  let searchQuery = '';

  function render() {
    const grid = document.getElementById('toolsGrid');
    const filtered = items.filter(item => {
      const matchCat = activeCat === 'all' || item.category === activeCat;
      const haystack = (item.name + ' ' + item.desc + ' ' + item.tags.join(' ')).toLowerCase();
      const matchSearch = !searchQuery || haystack.includes(searchQuery.toLowerCase());
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">没有找到匹配的工具或原型</div>`;
      return;
    }

    grid.innerHTML = filtered.map(item => `
      <a href="${item.url}" class="card" style="--card-accent: ${item.accent}">
        <div>
          <div class="card-header">
            <div class="card-avatar">${item.name.slice(0, 2)}</div>
            <div class="card-meta">
              <h2>${item.name}</h2>
              <div class="tag-list">
                ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
              </div>
            </div>
          </div>
          <div class="card-desc">${item.desc}</div>
        </div>
        <div class="card-footer">
          <span>直接运行原型</span>
          <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </div>
      </a>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    render();
  });

  document.getElementById('categoryPills').addEventListener('click', e => {
    if (e.target.classList.contains('pill')) {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      activeCat = e.target.dataset.cat;
      render();
    }
  });

  render();
</script>
</body>
</html>
